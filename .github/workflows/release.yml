name: immutable-release

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit SHA
        required: true
      web_ref:
        description: Web commit SHA
        required: true
      ai_ref:
        description: AI commit SHA
        required: true
      infrastructure_ref:
        description: Infrastructure commit SHA
        required: true
      release_tag:
        description: Immutable release identifier
        required: true
      # Production runs on Kubernetes (verified 2026-09-23: kubeadm cluster on the three VMs, every
      # workload in namespace warptalk, Traefik holding :80/:443 on the App VM). It is the only
      # deploy target this workflow has.
      k8s_dry_run:
        description: "Validate everything server-side (secrets, nodes, helm --dry-run=server) and change nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-scan-sign:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    outputs:
      # The Google OAuth client id, published so the PRODUCTION job can use the very same value
      # this job bakes into the web bundle.
      #
      # It has to travel as a job output because the two jobs sit in different GitHub
      # environments — `release` here, `production` below — and an environment variable is not
      # visible outside its own. That is exactly how the two halves came apart: the bundle was
      # built from this variable while the auth service read a hand-typed GOOGLE_CLIENT_ID line
      # on the production host, which still said
      # `google-oauth-disabled.apps.googleusercontent.com` months after the real client existed.
      # Google minted tokens for the bundle's client, the auth service compared them against the
      # placeholder, and every single Google sign-in failed with "Invalid Google token".
      #
      # An OAuth client id is not a secret — it ships inside the public JavaScript bundle — so
      # carrying it as a plain output costs nothing and makes the two values impossible to drift
      # apart: there is now one source, and both consumers read it.
      google_client_id: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
    env:
      IMAGE_REGISTRY: ghcr.io/warptalk-capstoneproject
      IMAGE_TAG: ${{ inputs.release_tag }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SIGNALR_URL: ${{ vars.NEXT_PUBLIC_SIGNALR_URL }}
      NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      VERIFY_REUSED_IMAGES: "true"
      BUILD_PARALLELISM: "4"
      COSIGN_CERTIFICATE_IDENTITY_REGEXP: ^https://github.com/WarpTalk-CapstoneProject/warptalk-infrastructure/.github/workflows/release.yml@refs/(heads|tags)/.+$
      COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-backend
          ref: ${{ inputs.backend_ref }}
          path: warptalk-backend
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-web
          ref: ${{ inputs.web_ref }}
          path: warptalk-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-ai
          ref: ${{ inputs.ai_ref }}
          path: warptalk-ai
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.infrastructure_ref }}
          path: warptalk-infrastructure
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Build and push immutable images
        working-directory: warptalk-infrastructure
        run: ./scripts/build-release.sh
      # The staged copies under scripts/service-migrations/ are what production actually
      # applies — app.compose.yml mounts ../../scripts as /scripts. CI already compares them
      # against the backend, but CI resolves the backend to a BRANCH (development), so when
      # that branch trails the commit being released, both sides are missing the same file
      # and the comparison passes on a lie. That is how a glossary seed reported success
      # three times while the table never changed.
      #
      # Here the comparison is against the exact backend SHA in this dispatch, so a migration
      # that exists in the released backend and not in the released infrastructure artifact
      # stops the release instead of deploying a no-op.
      - name: Released migrations must be staged for the released backend
        working-directory: warptalk-infrastructure
        run: ./scripts/check-service-migration-coverage.sh ../warptalk-backend
      - name: Package the selected infrastructure release
        working-directory: warptalk-infrastructure
        env:
          OUTPUT: ${{ runner.temp }}/warptalk-deployment.tar.gz
        run: |
          ./scripts/package-production-deployment.sh
          (
            cd "$(dirname "$OUTPUT")"
            sha256sum "$(basename "$OUTPUT")" >"$(basename "$OUTPUT").sha256"
          )
      - name: Install trusted scanning and signing tools
        run: |
          trivy_version=0.70.0
          trivy_archive="trivy_${trivy_version}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$trivy_archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error \
            --output trivy-checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_checksums.txt"
          grep " trivy_${trivy_version}_Linux-64bit.tar.gz$" trivy-checksums.txt |
            sha256sum --check
          tar -xzf "$trivy_archive" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Generate SBOMs, scan and verify every digest
        working-directory: warptalk-infrastructure
        env:
          RELEASE_MANIFEST: deploy/production/release-manifest.json
          SBOM_OUTPUT_DIR: deploy/production/sbom
          # Trivy uses an exclusive cache lock and GitHub's keyless OIDC token
          # endpoint is not safe to fan out from this job. Keep the security
          # gate serial; image builds and signed-image reuse remain parallel.
          SECURITY_PARALLELISM: "1"
        run: |
          ./scripts/secure-release-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: |
            warptalk-infrastructure/deploy/production/release-manifest.json
            warptalk-infrastructure/deploy/production/image-matrix.json
            warptalk-infrastructure/deploy/production/sbom
            warptalk-infrastructure/scripts/plan-release-deployment.sh
            ${{ runner.temp }}/warptalk-deployment.tar.gz
            ${{ runner.temp }}/warptalk-deployment.tar.gz.sha256

  # The Kubernetes release, and the only deploy job: the same signed digests the build job
  # produced, deployed by the scoped warptalk-deployer identity. Migrations run as the chart's
  # pre-upgrade hook inside the release step; acceptance and the automatic rollback are part of
  # deploy-k3s-release.sh. The cluster bootstrap (cluster-admin) is not part of a release; run it by
  # hand if a cluster is ever rebuilt - see deploy/k3s/README.md.
  production-k8s:
    needs: build-scan-sign
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: warptalk-production
      cancel-in-progress: false
    environment: production
    env:
      K8S_DRY_RUN: ${{ inputs.k8s_dry_run }}
      K3S_DRY_RUN: ${{ inputs.k8s_dry_run }}
      K3S_STORAGE_CLASS: ${{ vars.K8S_STORAGE_CLASS || 'local-path' }}
      K3S_TLS_SECRET_NAME: warptalk-tls
      # The nodes carry no topology.kubernetes.io/zone labels: all three VMs are one Vietnix zone.
      K3S_REQUIRE_DISTINCT_ZONES: "false"
      APP_BASE_URL: ${{ vars.PRODUCTION_APP_BASE_URL }}
      API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      # Job-level env cannot see runner.temp; set the per-run paths here.
      - name: Runner paths
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/k8s-deployer.kubeconfig" >>"$GITHUB_ENV"
          echo "WARPTALK_HELM_HOME=$RUNNER_TEMP/helm-home" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: release
      # The chart, values and scripts at the exact infrastructure SHA the build job packaged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.infrastructure_ref }}
          path: warptalk-infrastructure
      - name: Locate the signed release manifest
        run: |
          set -eu
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe release tag" >&2
              exit 1
              ;;
          esac
          manifest="$(find release -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          jq -e --arg tag "$RELEASE_TAG" '.tag == $tag' "$manifest" >/dev/null || {
            echo "release manifest tag does not match release_tag" >&2
            exit 1
          }
          echo "RELEASE_MANIFEST=$GITHUB_WORKSPACE/$manifest" >>"$GITHUB_ENV"
          domain="${APP_BASE_URL#https://}"
          domain="${domain%%/*}"
          case "$domain" in
            ""|*[!A-Za-z0-9.-]*) echo "Unsafe PRODUCTION_APP_BASE_URL" >&2; exit 1 ;;
          esac
          echo "K3S_DOMAIN=$domain" >>"$GITHUB_ENV"
      - name: Join the production tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          timeout: 45s
          retry: "3"
          ping: ${{ vars.PRODUCTION_APP_HOST }}
      - name: Install the deployer kubeconfig
        env:
          K8S_KUBECONFIG: ${{ secrets.K8S_KUBECONFIG }}
        run: |
          set -eu
          [ -n "$K8S_KUBECONFIG" ] || {
            echo "K8S_KUBECONFIG is not set in the production environment" >&2
            exit 1
          }
          umask 077
          printf '%s\n' "$K8S_KUBECONFIG" >"$KUBECONFIG"
          kubectl version --request-timeout=20s >/dev/null
          # Refuse a cluster-admin credential here: this job must run as the scoped deployer.
          if kubectl auth can-i '*' '*' --all-namespaces >/dev/null 2>&1; then
            echo "K8S_KUBECONFIG is cluster-admin; it must be the warptalk-deployer ServiceAccount" >&2
            exit 1
          fi
      - name: Runtime secrets from the production environment
        working-directory: warptalk-infrastructure
        env:
          K8S_RUNTIME_ENV: ${{ secrets.K8S_RUNTIME_ENV }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ needs.build-scan-sign.outputs.google_client_id }}
          GOOGLE_WORKSPACE_CLIENT_ID: ${{ vars.GOOGLE_WORKSPACE_CLIENT_ID }}
          GOOGLE_WORKSPACE_CLIENT_SECRET: ${{ secrets.GOOGLE_WORKSPACE_CLIENT_SECRET }}
          CARTESIA_ADMIN_API_KEY: ${{ secrets.CARTESIA_ADMIN_API_KEY }}
          CARTESIA_USAGE_API_KEY_ID: ${{ vars.CARTESIA_USAGE_API_KEY_ID }}
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -eu
          # One source of truth once K8S_RUNTIME_ENV exists: GitHub `production`. Until then the
          # release keeps reading the ClusterSecretStore the cluster was bootstrapped with, so the
          # next release does not wait on that secret - but it says so on every run.
          if [ -z "$K8S_RUNTIME_ENV" ]; then
            echo "::warning::K8S_RUNTIME_ENV is not set: runtime secrets still come from the warptalk-production-secret-store ClusterSecretStore (fake provider, values in its spec)"
            {
              echo "K3S_SECRET_SOURCE=external-secrets"
              echo "K3S_SECRET_STORE_NAME=warptalk-production-secret-store"
            } >>"$GITHUB_ENV"
            exit 0
          fi
          umask 077
          runtime_env="$RUNNER_TEMP/k8s-runtime.env"
          printf '%s\n' "$K8S_RUNTIME_ENV" >"$runtime_env"
          K8S_RUNTIME_ENV_FILE="$runtime_env" ./scripts/materialize-k8s-runtime-secrets.sh
          {
            echo "K3S_SECRET_SOURCE=github"
            # The backup credentials now carry ENDPOINT_URL, so Qdrant can snapshot to S3.
            echo "K3S_QDRANT_S3_SNAPSHOTS=true"
          } >>"$GITHUB_ENV"
          # The data chart needs the backup endpoint as a value (it carries the account id, so it
          # is not committed); read it here rather than exposing the whole env to later steps.
          endpoint="$(sed -n 's/^BACKUP_S3_ENDPOINT_URL=//p' "$runtime_env" | tail -n 1)"
          rm -f "$runtime_env"
          case "$endpoint" in
            https://*) ;;
            *) echo "BACKUP_S3_ENDPOINT_URL must be an https:// URL" >&2; exit 1 ;;
          esac
          echo "K3S_BACKUP_ENDPOINT_URL=$endpoint" >>"$GITHUB_ENV"
      - name: Node roles and taints
        working-directory: warptalk-infrastructure
        env:
          K8S_DATA_NODE_IP: ${{ vars.PRODUCTION_DATA_HOST }}
          K8S_INFRA_NODE_IP: ${{ vars.PRODUCTION_INFRA_HOST }}
          K8S_APP_NODES: ${{ vars.K8S_APP_NODES }}
          K8S_DATA_NODES: ${{ vars.K8S_DATA_NODES }}
          K8S_INFRA_NODES: ${{ vars.K8S_INFRA_NODES }}
        run: ./scripts/label-k8s-nodes.sh
      - name: Data platform
        working-directory: warptalk-infrastructure
        env:
          K3S_DATA_VALUES_FILE: deploy/k3s/k8s-data-values.yaml
        run: ./scripts/deploy-k3s-data.sh
      - name: Release, migrations and acceptance (automatic rollback on failure)
        working-directory: warptalk-infrastructure
        env:
          K3S_VALUES_FILE: deploy/k3s/k8s-app-values.yaml
        run: ./scripts/deploy-k3s-release.sh
      - name: Public health endpoints
        if: ${{ !inputs.k8s_dry_run }}
        working-directory: warptalk-infrastructure
        run: ./scripts/smoke-production.sh
      # Evidence, not a gate: acceptance above already decided. The JSON lands in the run summary
      # so "what did prod look like right after vNNN" has an answer without a shell on any host.
      - name: Health inspection (Kubernetes mode)
        if: ${{ !inputs.k8s_dry_run }}
        continue-on-error: true
        working-directory: warptalk-infrastructure
        run: |
          set -eu
          report="$RUNNER_TEMP/health-inspection.json"
          status=0
          python3 health-inspector/inspector.py --platform k8s --role all --since 15m --json \
            >"$report" || status=$?
          {
            echo "### Health inspection after $RELEASE_TAG (exit $status)"
            echo '```json'
            jq '{exitCode, results: [.results[] | select(.status != "pass")], logFindings}' "$report"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
