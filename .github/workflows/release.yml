name: immutable-release

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit SHA
        required: true
      web_ref:
        description: Web commit SHA
        required: true
      ai_ref:
        description: AI commit SHA
        required: true
      infrastructure_ref:
        description: Infrastructure commit SHA
        required: true
      release_tag:
        description: Immutable release identifier
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    env:
      IMAGE_REGISTRY: ghcr.io/warptalk-capstoneproject
      IMAGE_TAG: ${{ inputs.release_tag }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SIGNALR_URL: ${{ vars.NEXT_PUBLIC_SIGNALR_URL }}
      NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-backend
          ref: ${{ inputs.backend_ref }}
          path: warptalk-backend
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-web
          ref: ${{ inputs.web_ref }}
          path: warptalk-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-ai
          ref: ${{ inputs.ai_ref }}
          path: warptalk-ai
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.infrastructure_ref }}
          path: warptalk-infrastructure
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable images
        working-directory: warptalk-infrastructure
        run: ./scripts/build-release.sh
      - name: Package the selected infrastructure release
        working-directory: warptalk-infrastructure
        env:
          OUTPUT: ${{ runner.temp }}/warptalk-deployment.tar.gz
        run: |
          ./scripts/package-production-deployment.sh
          (
            cd "$(dirname "$OUTPUT")"
            sha256sum "$(basename "$OUTPUT")" >"$(basename "$OUTPUT").sha256"
          )
      - name: Install trusted scanning and signing tools
        run: |
          trivy_version=0.70.0
          trivy_archive="trivy_${trivy_version}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$trivy_archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error \
            --output trivy-checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_checksums.txt"
          grep " trivy_${trivy_version}_Linux-64bit.tar.gz$" trivy-checksums.txt |
            sha256sum --check
          tar -xzf "$trivy_archive" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Generate SBOMs, scan and keylessly sign every digest
        working-directory: warptalk-infrastructure
        run: |
          mkdir -p deploy/production/sbom
          jq -c '.images[]' deploy/production/release-manifest.json |
          while IFS= read -r image; do
            name="$(printf '%s' "$image" | jq -r '.name')"
            ref="$(printf '%s' "$image" | jq -r '.ref')"
            digest="$(printf '%s' "$image" | jq -r '.digest')"
            subject="$ref@$digest"
            trivy image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              "$subject"
            trivy image \
              --format spdx-json \
              --output "deploy/production/sbom/$name.spdx.json" \
              "$subject"
            cosign sign --yes "$subject"
            cosign attest --yes \
              --predicate "deploy/production/sbom/$name.spdx.json" \
              --type spdxjson \
              "$subject"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: |
            warptalk-infrastructure/deploy/production/release-manifest.json
            warptalk-infrastructure/deploy/production/sbom
            ${{ runner.temp }}/warptalk-deployment.tar.gz
            ${{ runner.temp }}/warptalk-deployment.tar.gz.sha256

  staging:
    needs: build-scan-sign
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: release
      - name: Install SSH identity
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy the same digests to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          APP_BASE_URL: ${{ vars.STAGING_APP_BASE_URL }}
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe release tag" >&2
              exit 1
              ;;
          esac
          manifest="$(find release -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          scp "$manifest" \
            "$STAGING_USER@$STAGING_HOST:/opt/warptalk/releases/$RELEASE_TAG.json"
          ssh "$STAGING_USER@$STAGING_HOST" \
            "DEPLOY_ROLE=app \
             RELEASE_MANIFEST=/opt/warptalk/releases/$RELEASE_TAG.json \
             PRODUCTION_ENV_FILE=/etc/warptalk/staging.env \
             /opt/warptalk/current/scripts/deploy-release.sh"
          case "$APP_BASE_URL $API_BASE_URL" in
            *"'"*|*[\;\&\|]*)
              echo "Unsafe staging URL" >&2
              exit 1
              ;;
          esac
          # shellcheck disable=SC2029
          ssh "$STAGING_USER@$STAGING_HOST" \
            "APP_BASE_URL='$APP_BASE_URL' API_BASE_URL='$API_BASE_URL' \
             /opt/warptalk/current/scripts/smoke-production.sh"

  production:
    needs: build-scan-sign
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: warptalk-production
      cancel-in-progress: false
    # Gated by the "production" GitHub Environment's required reviewers — the
    # job pauses here until someone with access clicks Approve in the Actions
    # run, then deploys the exact digests build-scan-sign just scanned/signed.
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: release
      - name: Join the production tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: ${{ vars.PRODUCTION_APP_HOST }}
      - name: Install SSH identity
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_APP_HOST: ${{ vars.PRODUCTION_APP_HOST }}
          PRODUCTION_DATA_HOST: ${{ vars.PRODUCTION_DATA_HOST }}
          PRODUCTION_INFRA_HOST: ${{ vars.PRODUCTION_INFRA_HOST }}
          PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          for address in \
            "$PRODUCTION_APP_HOST" \
            "$PRODUCTION_DATA_HOST" \
            "$PRODUCTION_INFRA_HOST"; do
            case "$address" in
              ""|*[!A-Za-z0-9.:-]*)
                echo "Unsafe production host address" >&2
                exit 1
                ;;
            esac
          done
          case "$PRODUCTION_USER" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe production SSH user" >&2
              exit 1
              ;;
          esac
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host production-app
            HostName $PRODUCTION_APP_HOST
            User $PRODUCTION_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes

          Host production-data
            HostName $PRODUCTION_DATA_HOST
            User $PRODUCTION_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyJump production-app
            StrictHostKeyChecking yes

          Host production-infra
            HostName $PRODUCTION_INFRA_HOST
            User $PRODUCTION_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyJump production-app
            StrictHostKeyChecking yes
          EOF
          chmod 0600 ~/.ssh/config
      - name: Deploy the same digests to production
        env:
          APP_BASE_URL: ${{ vars.PRODUCTION_APP_BASE_URL }}
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe release tag" >&2
              exit 1
              ;;
          esac
          manifest="$(find release -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          bundle="$(find release -type f -name warptalk-deployment.tar.gz -print -quit)"
          checksum="$(find release -type f -name warptalk-deployment.tar.gz.sha256 -print -quit)"
          test -n "$bundle"
          test -n "$checksum"
          (
            cd "$(dirname "$bundle")"
            sha256sum --check "$(basename "$checksum")"
          )

          release_dir="/opt/warptalk/releases/$RELEASE_TAG"
          remote_manifest="$release_dir/deploy/production/release-manifest.json"

          stage_host() {
            host="$1"
            remote_bundle="/tmp/warptalk-$RELEASE_TAG-$GITHUB_RUN_ID.tar.gz"
            remote_manifest_tmp="/tmp/warptalk-$RELEASE_TAG-$GITHUB_RUN_ID.json"
            scp "$bundle" "$host:$remote_bundle"
            scp "$manifest" "$host:$remote_manifest_tmp"
            ssh "$host" \
              "sudo env RELEASE_DIR='$release_dir' \
               REMOTE_BUNDLE='$remote_bundle' \
               REMOTE_MANIFEST='$remote_manifest_tmp' sh -s" <<'REMOTE'
          set -eu
          test ! -e "$RELEASE_DIR" || {
            echo "Immutable release directory already exists: $RELEASE_DIR" >&2
            exit 1
          }
          incoming="$(mktemp -d /opt/warptalk/releases/.incoming.XXXXXX)"
          cleanup() {
            if [ -n "$incoming" ]; then
              rm -rf "$incoming"
            fi
            rm -f "$REMOTE_BUNDLE" "$REMOTE_MANIFEST"
          }
          trap cleanup EXIT INT TERM
          tar -xzf "$REMOTE_BUNDLE" -C "$incoming"
          install -m 0640 -o root -g docker \
            "$REMOTE_MANIFEST" \
            "$incoming/deploy/production/release-manifest.json"
          chown -R root:docker "$incoming"
          chmod -R g+rX "$incoming"
          mv "$incoming" "$RELEASE_DIR"
          incoming=""
          REMOTE
          }

          deploy_host() {
            role="$1"
            host="$2"
            {
              printf '%s\n' "$GHCR_TOKEN"
              cat <<'REMOTE'
          set -eu
          IFS= read -r ghcr_token
          docker_config="$(mktemp -d /run/warptalk-ghcr.XXXXXX)"
          cleanup() {
            docker --config "$docker_config" logout ghcr.io >/dev/null 2>&1 || true
            rm -rf "$docker_config"
          }
          trap cleanup EXIT INT TERM
          printf '%s' "$ghcr_token" |
            docker --config "$docker_config" login \
              --username "$GHCR_USER" --password-stdin ghcr.io
          DOCKER_CONFIG="$docker_config" \
          DEPLOY_ROLE="$DEPLOY_ROLE" \
          RELEASE_MANIFEST="$RELEASE_MANIFEST" \
          PRODUCTION_ENV_FILE=/etc/warptalk/.env.production \
            "$RELEASE_DIR/scripts/deploy-release.sh"
          ln -sfn "$RELEASE_DIR" /opt/warptalk/current
          REMOTE
            } | ssh "$host" \
              "sudo env DEPLOY_ROLE='$role' \
               RELEASE_DIR='$release_dir' \
               RELEASE_MANIFEST='$remote_manifest' \
               GHCR_USER='$GHCR_USER' sh -s"
          }

          stage_host production-data
          stage_host production-infra
          stage_host production-app
          deploy_host data production-data
          deploy_host infra production-infra
          deploy_host app production-app

          case "$APP_BASE_URL $API_BASE_URL" in
            *"'"*|*[\;\&\|]*)
              echo "Unsafe production URL" >&2
              exit 1
              ;;
          esac
          # shellcheck disable=SC2029
          ssh production-app \
            "APP_BASE_URL='$APP_BASE_URL' API_BASE_URL='$API_BASE_URL' \
             '$release_dir/scripts/smoke-production.sh'"
