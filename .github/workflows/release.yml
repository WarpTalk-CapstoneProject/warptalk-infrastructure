name: immutable-release

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit SHA
        required: true
      web_ref:
        description: Web commit SHA
        required: true
      ai_ref:
        description: AI commit SHA
        required: true
      infrastructure_ref:
        description: Infrastructure commit SHA
        required: true
      release_tag:
        description: Immutable release identifier
        required: true
      force_full_deploy:
        description: Redeploy every role (required after runtime secret or host environment changes)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-scan-sign:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    env:
      IMAGE_REGISTRY: ghcr.io/warptalk-capstoneproject
      IMAGE_TAG: ${{ inputs.release_tag }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SIGNALR_URL: ${{ vars.NEXT_PUBLIC_SIGNALR_URL }}
      NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      VERIFY_REUSED_IMAGES: "true"
      BUILD_PARALLELISM: "4"
      COSIGN_CERTIFICATE_IDENTITY_REGEXP: ^https://github.com/WarpTalk-CapstoneProject/warptalk-infrastructure/.github/workflows/release.yml@refs/(heads|tags)/.+$
      COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-backend
          ref: ${{ inputs.backend_ref }}
          path: warptalk-backend
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-web
          ref: ${{ inputs.web_ref }}
          path: warptalk-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-ai
          ref: ${{ inputs.ai_ref }}
          path: warptalk-ai
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.infrastructure_ref }}
          path: warptalk-infrastructure
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Build and push immutable images
        working-directory: warptalk-infrastructure
        run: ./scripts/build-release.sh
      # The staged copies under scripts/service-migrations/ are what production actually
      # applies — app.compose.yml mounts ../../scripts as /scripts. CI already compares them
      # against the backend, but CI resolves the backend to a BRANCH (development), so when
      # that branch trails the commit being released, both sides are missing the same file
      # and the comparison passes on a lie. That is how a glossary seed reported success
      # three times while the table never changed.
      #
      # Here the comparison is against the exact backend SHA in this dispatch, so a migration
      # that exists in the released backend and not in the released infrastructure artifact
      # stops the release instead of deploying a no-op.
      - name: Released migrations must be staged for the released backend
        working-directory: warptalk-infrastructure
        run: ./scripts/check-service-migration-coverage.sh ../warptalk-backend
      - name: Package the selected infrastructure release
        working-directory: warptalk-infrastructure
        env:
          OUTPUT: ${{ runner.temp }}/warptalk-deployment.tar.gz
        run: |
          ./scripts/package-production-deployment.sh
          (
            cd "$(dirname "$OUTPUT")"
            sha256sum "$(basename "$OUTPUT")" >"$(basename "$OUTPUT").sha256"
          )
      - name: Install trusted scanning and signing tools
        run: |
          trivy_version=0.70.0
          trivy_archive="trivy_${trivy_version}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$trivy_archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error \
            --output trivy-checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_checksums.txt"
          grep " trivy_${trivy_version}_Linux-64bit.tar.gz$" trivy-checksums.txt |
            sha256sum --check
          tar -xzf "$trivy_archive" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Generate SBOMs, scan and verify every digest
        working-directory: warptalk-infrastructure
        env:
          RELEASE_MANIFEST: deploy/production/release-manifest.json
          SBOM_OUTPUT_DIR: deploy/production/sbom
          # Trivy uses an exclusive cache lock and GitHub's keyless OIDC token
          # endpoint is not safe to fan out from this job. Keep the security
          # gate serial; image builds and signed-image reuse remain parallel.
          SECURITY_PARALLELISM: "1"
        run: |
          ./scripts/secure-release-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: |
            warptalk-infrastructure/deploy/production/release-manifest.json
            warptalk-infrastructure/deploy/production/image-matrix.json
            warptalk-infrastructure/deploy/production/sbom
            warptalk-infrastructure/scripts/plan-release-deployment.sh
            ${{ runner.temp }}/warptalk-deployment.tar.gz
            ${{ runner.temp }}/warptalk-deployment.tar.gz.sha256

  staging:
    needs: build-scan-sign
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: release
      - name: Install SSH identity
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy the same digests to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          APP_BASE_URL: ${{ vars.STAGING_APP_BASE_URL }}
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe release tag" >&2
              exit 1
              ;;
          esac
          manifest="$(find release -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          scp "$manifest" \
            "$STAGING_USER@$STAGING_HOST:/opt/warptalk/releases/$RELEASE_TAG.json"
          ssh "$STAGING_USER@$STAGING_HOST" \
            "DEPLOY_ROLE=app \
             RELEASE_MANIFEST=/opt/warptalk/releases/$RELEASE_TAG.json \
             PRODUCTION_ENV_FILE=/etc/warptalk/staging.env \
             /opt/warptalk/current/scripts/deploy-release.sh"
          case "$APP_BASE_URL $API_BASE_URL" in
            *"'"*|*[\;\&\|]*)
              echo "Unsafe staging URL" >&2
              exit 1
              ;;
          esac
          # shellcheck disable=SC2029
          ssh "$STAGING_USER@$STAGING_HOST" \
            "APP_BASE_URL='$APP_BASE_URL' API_BASE_URL='$API_BASE_URL' \
             /opt/warptalk/current/scripts/smoke-production.sh"

  production:
    needs: build-scan-sign
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: warptalk-production
      cancel-in-progress: false
    # Gated by the "production" GitHub Environment's required reviewers — the
    # job pauses here until someone with access clicks Approve in the Actions
    # run, then deploys the exact digests build-scan-sign just scanned/signed.
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ inputs.release_tag }}
          path: release
      - name: Join the production tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          timeout: 45s
          retry: "3"
          ping: ${{ vars.PRODUCTION_APP_HOST }}
      - name: Install SSH identity
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_APP_HOST: ${{ vars.PRODUCTION_APP_HOST }}
          PRODUCTION_DATA_HOST: ${{ vars.PRODUCTION_DATA_HOST }}
          PRODUCTION_INFRA_HOST: ${{ vars.PRODUCTION_INFRA_HOST }}
          PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          for address in \
            "$PRODUCTION_APP_HOST" \
            "$PRODUCTION_DATA_HOST" \
            "$PRODUCTION_INFRA_HOST"; do
            case "$address" in
              ""|*[!A-Za-z0-9.:-]*)
                echo "Unsafe production host address" >&2
                exit 1
                ;;
            esac
          done
          case "$PRODUCTION_USER" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe production SSH user" >&2
              exit 1
              ;;
          esac
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host production-app
            HostName $PRODUCTION_APP_HOST
            User $PRODUCTION_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes

          Host production-data
            HostName $PRODUCTION_DATA_HOST
            User $PRODUCTION_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyJump production-app
            StrictHostKeyChecking yes

          Host production-infra
            HostName $PRODUCTION_INFRA_HOST
            User $PRODUCTION_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyJump production-app
            StrictHostKeyChecking yes
          EOF
          chmod 0600 ~/.ssh/config
      - name: Deploy the same digests to production
        env:
          APP_BASE_URL: ${{ vars.PRODUCTION_APP_BASE_URL }}
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE_FULL_DEPLOY: ${{ inputs.force_full_deploy }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # Runtime secrets that live in GitHub rather than in a hand-typed line on the host.
          # Unset ones arrive empty and are skipped, so a repository that has not configured
          # them deploys exactly as before. Adding another is one line here and one below.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe release tag" >&2
              exit 1
              ;;
          esac
          manifest="$(find release -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          bundle="$(find release -type f -name warptalk-deployment.tar.gz -print -quit)"
          checksum="$(find release -type f -name warptalk-deployment.tar.gz.sha256 -print -quit)"
          test -n "$bundle"
          test -n "$checksum"
          (
            cd "$(dirname "$bundle")"
            sha256sum --check "$(basename "$checksum")"
          )

          release_dir="/opt/warptalk/releases/$RELEASE_TAG"
          remote_manifest="$release_dir/deploy/production/release-manifest.json"
          planner="$(find release -type f -name plan-release-deployment.sh -print -quit)"
          test -n "$planner"
          current_manifest="$RUNNER_TEMP/current-release-manifest.json"
          deployment_plan="$RUNNER_TEMP/deployment-plan.json"
          if ! scp \
            production-app:/opt/warptalk/current/deploy/production/release-manifest.json \
            "$current_manifest"; then
            printf '{}\n' >"$current_manifest"
          fi
          FORCE_FULL_DEPLOY="$FORCE_FULL_DEPLOY" \
            sh "$planner" "$current_manifest" "$manifest" >"$deployment_plan"
          jq . "$deployment_plan"
          {
            echo '### Production deployment plan'
            echo '```json'
            jq . "$deployment_plan"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

          stage_host() {
            host="$1"
            remote_bundle="/tmp/warptalk-$RELEASE_TAG-$GITHUB_RUN_ID.tar.gz"
            remote_manifest_tmp="/tmp/warptalk-$RELEASE_TAG-$GITHUB_RUN_ID.json"
            scp "$bundle" "$host:$remote_bundle"
            scp "$manifest" "$host:$remote_manifest_tmp"
            ssh "$host" \
              "sudo env RELEASE_DIR='$release_dir' \
               REMOTE_BUNDLE='$remote_bundle' \
               REMOTE_MANIFEST='$remote_manifest_tmp' sh -s" <<'REMOTE'
          set -eu
          test ! -e "$RELEASE_DIR" || {
            echo "Immutable release directory already exists: $RELEASE_DIR" >&2
            exit 1
          }
          incoming="$(mktemp -d /opt/warptalk/releases/.incoming.XXXXXX)"
          cleanup() {
            if [ -n "$incoming" ]; then
              rm -rf "$incoming"
            fi
            rm -f "$REMOTE_BUNDLE" "$REMOTE_MANIFEST"
          }
          trap cleanup EXIT INT TERM
          tar -xzf "$REMOTE_BUNDLE" -C "$incoming"
          install -m 0640 -o root -g docker \
            "$REMOTE_MANIFEST" \
            "$incoming/deploy/production/release-manifest.json"
          chown -R root:docker "$incoming"
          chmod -R g+rX "$incoming"
          mv "$incoming" "$RELEASE_DIR"
          incoming=""
          REMOTE
          }

          stage_role() {
            role="$1"
            host="$2"
            should_deploy="$(jq -r --arg role "$role" '.roles[$role].deploy' "$deployment_plan")"
            if [ "$should_deploy" != "true" ]; then
              echo "release staging: skipping unchanged $role role"
              return 0
            fi
            stage_host "$host"
          }

          # The runtime secrets to push, as KEY=VALUE lines. Built here rather than interpolated
          # into the remote command: a secret on a command line is a secret in the process table
          # of a production host, visible to every user on it.
          runtime_secrets=""
          # A literal newline, built rather than typed: this whole script is a YAML block scalar,
          # and a line starting at column 0 to close a quote ends the block instead.
          newline="$(printf '\nx')"
          newline="${newline%x}"
          add_runtime_secret() {
            # An unset GitHub secret is an empty string. Sending it would say nothing and cost a
            # round trip; apply-runtime-secrets.sh ignores it anyway, so drop it here.
            [ -n "${2:-}" ] || return 0
            runtime_secrets="$runtime_secrets$1=$2$newline"
          }
          add_runtime_secret STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}"
          add_runtime_secret STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET:-}"
          add_runtime_secret LIVEKIT_URL "${LIVEKIT_URL:-}"
          add_runtime_secret LIVEKIT_API_KEY "${LIVEKIT_API_KEY:-}"
          add_runtime_secret LIVEKIT_API_SECRET "${LIVEKIT_API_SECRET:-}"

          deploy_host() {
            role="$1"
            host="$2"
            should_deploy="$(jq -r --arg role "$role" '.roles[$role].deploy' "$deployment_plan")"
            if [ "$should_deploy" != "true" ]; then
              echo "release deploy: skipping unchanged $role role"
              return 0
            fi
            full_deploy="$(jq -r --arg role "$role" '.roles[$role].fullDeploy' "$deployment_plan")"
            run_migrations="$(jq -r --arg role "$role" '.roles[$role].runMigrations' "$deployment_plan")"
            if [ "$full_deploy" = "true" ]; then
              deploy_mode=full
              deploy_services=""
            else
              deploy_mode=selective
              deploy_services="$(jq -r --arg role "$role" \
                '.roles[$role].changedServices | join(" ")' "$deployment_plan")"
            fi
            # Runtime secrets before the deploy, so the containers this release creates read the
            # new values.
            #
            # EVERY role, not just app. Only the app services consume Stripe, so staging it on data
            # and infra looks like a needless extra copy — but the copy is already there: all three
            # hosts hold the same /etc/warptalk/.env.production, built from the same template, and
            # validate-production-env.sh runs on each of them and demands every template key be
            # valid. Applying to app alone left data and infra sitting on the placeholder, and
            # since deploy_host runs data FIRST, the release failed on the data host before the app
            # host was ever reached. Writing the value everywhere keeps the file identical across
            # hosts, which is what the validator already assumes.
            if [ -n "$runtime_secrets" ]; then
              remote_secrets_file="/tmp/warptalk-runtime-secrets-$RELEASE_TAG-$GITHUB_RUN_ID.env"
              printf '%s' "$runtime_secrets" | ssh "$host" \
                "umask 077; cat > '$remote_secrets_file'; chmod 0600 '$remote_secrets_file'"
              secrets_result="$(ssh "$host" \
                "sudo env PRODUCTION_ENV_FILE=/etc/warptalk/.env.production \
                 RUNTIME_SECRETS_FILE='$remote_secrets_file' \
                 '$release_dir/scripts/apply-runtime-secrets.sh'" || echo failed)"
              ssh "$host" "rm -f '$remote_secrets_file'" || true

              case "$secrets_result" in
                changed)
                  # A container only re-reads its environment when it is recreated. A selective
                  # deploy that happens to exclude the billing service would leave the OLD secret
                  # running and still report success — which is the trap every hand-edit falls
                  # into. Promote to full rather than rely on anyone remembering.
                  echo "runtime secrets changed on $role: deploying every service so the new environment takes effect"
                  deploy_mode=full
                  deploy_services=""
                  ;;
                unchanged) ;;
                *)
                  echo "Failed to apply runtime secrets on $role" >&2
                  return 1
                  ;;
              esac
            fi
            remote_token_file="/tmp/warptalk-ghcr-$RELEASE_TAG-$GITHUB_RUN_ID.token"
            printf '%s' "$GHCR_TOKEN" | ssh "$host" \
              "umask 077; cat > '$remote_token_file'; chmod 0600 '$remote_token_file'"
            ssh "$host" \
              "sudo env DEPLOY_ROLE='$role' \
               RELEASE_DIR='$release_dir' \
               RELEASE_MANIFEST='$remote_manifest' \
               DEPLOY_MODE='$deploy_mode' \
               DEPLOY_SERVICES='$deploy_services' \
               RUN_MIGRATIONS='$run_migrations' \
               GHCR_USER='$GHCR_USER' \
               TOKEN_FILE='$remote_token_file' sh -s" <<'REMOTE'
          set -eu
          docker_config=""
          cleanup() {
            if [ -n "$docker_config" ]; then
              docker --config "$docker_config" logout ghcr.io >/dev/null 2>&1 || true
              rm -rf "$docker_config"
            fi
            rm -f "$TOKEN_FILE"
          }
          trap cleanup EXIT INT TERM
          ghcr_token="$(cat "$TOKEN_FILE")"
          docker_config="$(mktemp -d /run/warptalk-ghcr.XXXXXX)"
          printf '%s' "$ghcr_token" |
            docker --config "$docker_config" login \
              --username "$GHCR_USER" --password-stdin ghcr.io
          DOCKER_CONFIG="$docker_config" \
          DEPLOY_ROLE="$DEPLOY_ROLE" \
          RELEASE_MANIFEST="$RELEASE_MANIFEST" \
          DEPLOY_MODE="$DEPLOY_MODE" \
          DEPLOY_SERVICES="$DEPLOY_SERVICES" \
          RUN_MIGRATIONS="$RUN_MIGRATIONS" \
          PRODUCTION_ENV_FILE=/etc/warptalk/.env.production \
            "$RELEASE_DIR/scripts/deploy-release.sh"
          ln -sfn "$RELEASE_DIR" /opt/warptalk/current
          REMOTE
          }

          stage_role data production-data & data_stage_pid=$!
          stage_role infra production-infra & infra_stage_pid=$!
          stage_role app production-app & app_stage_pid=$!
          stage_failed=false
          for stage_pid in "$data_stage_pid" "$infra_stage_pid" "$app_stage_pid"; do
            if ! wait "$stage_pid"; then
              stage_failed=true
            fi
          done
          [ "$stage_failed" = "false" ] || {
            echo "Failed to stage the immutable release on selected production hosts" >&2
            exit 1
          }
          deploy_host data production-data
          deploy_host infra production-infra
          deploy_host app production-app

          case "$APP_BASE_URL $API_BASE_URL" in
            *"'"*|*[\;\&\|]*)
              echo "Unsafe production URL" >&2
              exit 1
              ;;
          esac
          # shellcheck disable=SC2029
          ssh production-app \
            "APP_BASE_URL='$APP_BASE_URL' API_BASE_URL='$API_BASE_URL' \
             /opt/warptalk/current/scripts/smoke-production.sh"
