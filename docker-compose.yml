# ====================================================================
# WarpTalk — Full Stack Docker Compose (Base)
# Local development base; production uses deploy/production/*.compose.yml.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ====================================================================

services:

  # On-demand operations image. It is excluded from normal startup and runs only
  # with: docker compose --profile tools run --rm health-inspector
  health-inspector:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: health-inspector/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - warptalk-net


  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: warptalk-postgres
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warptalk}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - warptalk-net

  # ── Migrator — applies scripts/migrations/*.sql, in chronological order,
  #    before any service that needs the DB starts. One-shot: runs to
  #    completion and exits; see scripts/run-migrations.sh for the ordering
  #    logic and why plain alphabetical sort of the filenames is unsafe.
  migrator:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: warptalk-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-warptalk}
      MIGRATIONS_DIR: /scripts/migrations
      SERVICE_MIGRATIONS_ROOT: /service-migrations
      RELEASE_ID: ${IMAGE_TAG:-local-compose}
      MIGRATION_APPLIED_BY: local-compose-migrator
      SUBSCRIPTION_DB_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD}
      WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:-warptalk-workspace-dev} # gitleaks:allow
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      TRANSLATION_ROOM_DB_PASSWORD: ${TRANSLATION_ROOM_DB_PASSWORD:-warptalk-translation-room-dev} # gitleaks:allow
      TRANSCRIPT_DB_PASSWORD: ${TRANSCRIPT_DB_PASSWORD}
      MEETING_DB_PASSWORD: ${MEETING_DB_PASSWORD}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:-warptalk-assistant-dev} # gitleaks:allow
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?Set MONITOR_DB_PASSWORD in .env}
    volumes:
      - ./scripts:/scripts:ro
      - ../warptalk-backend/auth/database/migrations:/service-migrations/auth:ro
      - ../warptalk-backend/workspace/database/migrations:/service-migrations/workspace:ro
      - ../warptalk-backend/translation-room/database/migrations:/service-migrations/translation-room:ro
      - ../warptalk-backend/transcript/database/migrations:/service-migrations/transcript:ro
      - ../warptalk-backend/notification/database/migrations:/service-migrations/notification:ro
      - ../warptalk-backend/meeting/database/migrations:/service-migrations/meeting:ro
      - ../warptalk-backend/assistant/database/migrations:/service-migrations/assistant:ro
      - ../warptalk-backend/billing/database/migrations:/service-migrations/billing:ro
    # Self-heal against CRLF: /scripts is read-only, so copy to a writable
    # tmp path, strip carriage returns, then run. Works even if a Windows
    # checkout left CRLF in run-migrations.sh (no re-clone needed).
    # MIGRATIONS_DIR must be pinned because $0/dirname now points at /tmp.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        tr -d '\r' < /scripts/run-migrations.sh > /tmp/run-migrations.sh
        tr -d '\r' < /scripts/provision-service-db-users.sh > /tmp/provision-service-db-users.sh
        tr -d '\r' < /scripts/extract-logical-databases.sh > /tmp/extract-logical-databases.sh
        tr -d '\r' < /scripts/run-logical-database-migrations.sh > /tmp/run-logical-database-migrations.sh
        export MIGRATIONS_DIR=/scripts/migrations
        sh /tmp/run-migrations.sh
        sh /tmp/provision-service-db-users.sh
        sh /tmp/extract-logical-databases.sh
        sh /tmp/run-logical-database-migrations.sh
        exec sh /scripts/enable-postgres-performance-observability.sh
    networks:
      - warptalk-net

  # ── PgBouncer — Connection Pooling ────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    container_name: warptalk-pgbouncer
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-warptalk}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 15
      MIN_POOL_SIZE: 2
      RESERVE_POOL_SIZE: 5
      IGNORE_STARTUP_PARAMETERS: extra_float_digits, search_path
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - warptalk-net

  # ── Redis — Cache + Streams ───────────────────────────────────────
  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: warptalk-redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - warptalk-net

  # ── RabbitMQ — Durable domain events ─────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine@sha256:0753b75ce99094c385483d89449d532a0544fb85e4942a478b21cc497ab66d33
    container_name: warptalk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-warptalk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-warptalk-dev-rabbitmq}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - warptalk-net

  # ── MinIO — S3 Compatible Object Storage ─────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: warptalk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-warptalk-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-warptalk-s3-secretkey} # gitleaks:allow
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - warptalk-net

  minio-workspace-provisioner:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: warptalk-minio-workspace-provisioner
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_WORKSPACE_DOCUMENTS_BUCKET:-warptalk-workspace-documents}" &&
        mc anonymous set none "local/$${MINIO_WORKSPACE_DOCUMENTS_BUCKET:-warptalk-workspace-documents}" &&
        mc mb --ignore-existing "local/$${MINIO_MEETING_CHAT_BUCKET:-warptalk-meeting-chat}" &&
        mc anonymous set none "local/$${MINIO_MEETING_CHAT_BUCKET:-warptalk-meeting-chat}" &&
        mc mb --ignore-existing "local/$${MINIO_VOICE_SAMPLES_BUCKET:-warptalk-voice-samples}" &&
        mc anonymous set none "local/$${MINIO_VOICE_SAMPLES_BUCKET:-warptalk-voice-samples}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-warptalk-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-warptalk-s3-secretkey} # gitleaks:allow
      MINIO_WORKSPACE_DOCUMENTS_BUCKET: ${MINIO_WORKSPACE_DOCUMENTS_BUCKET:-warptalk-workspace-documents}
      MINIO_MEETING_CHAT_BUCKET: ${MINIO_MEETING_CHAT_BUCKET:-warptalk-meeting-chat}
      MINIO_VOICE_SAMPLES_BUCKET: ${MINIO_VOICE_SAMPLES_BUCKET:-warptalk-voice-samples}
    networks:
      - warptalk-net

  # ── Auth Service ──────────────────────────────────────────────────
  auth-service:
    build:
      context: ../warptalk-backend
      dockerfile: auth/Dockerfile
    container_name: warptalk-auth
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__AuthDb: "Host=pgbouncer;Port=6432;Database=warptalk_auth;Username=warptalk_auth;Password=${AUTH_DB_PASSWORD};Search Path=auth,public;GSS Encryption Mode=Disable"
      AppBaseUrl: ${APP_BASE_URL:-http://localhost:3000}
      GrpcSettings__WorkspaceServiceUrl: "http://workspace-service:50056"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Storage__Provider: ${AUTH_STORAGE_PROVIDER:-MinIO}
      Storage__S3__ServiceUrl: ${AUTH_STORAGE_S3_ENDPOINT:-http://minio:9000}
      Storage__S3__AccessKey: ${MINIO_ROOT_USER:-warptalk-admin}
      Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD:-warptalk-s3-secretkey} # gitleaks:allow
      Storage__S3__BucketName: ${MINIO_VOICE_SAMPLES_BUCKET:-warptalk-voice-samples}
      Storage__S3__EnsureBucketExists: ${AUTH_STORAGE_ENSURE_BUCKET:-false}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      minio-workspace-provisioner:
        condition: service_completed_successfully
    networks:
      - warptalk-net

  # ── Workspace Service ─────────────────────────────────────────────
  workspace-service:
    build:
      context: ../warptalk-backend
      dockerfile: workspace/Dockerfile
    container_name: warptalk-workspace
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__WorkspaceDb: "Host=pgbouncer;Port=6432;Database=warptalk_workspace;Username=warptalk_workspace;Password=${WORKSPACE_DB_PASSWORD:-warptalk-workspace-dev};Search Path=workspace,public;GSS Encryption Mode=Disable"
      AppBaseUrl: ${APP_BASE_URL:-http://localhost:3000}
      GrpcSettings__AuthServiceUrl: "http://auth-service:50051"
      GrpcSettings__BillingServiceUrl: "http://billing-service:50057"
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}

      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-warptalk}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-warptalk-dev-rabbitmq}
      Storage__Provider: ${WORKSPACE_STORAGE_PROVIDER:-MinIO}
      Storage__MasterKey: ${WORKSPACE_STORAGE_MASTER_KEY:-warptalk-local-storage-master-key-change-for-shared-environments}
      Storage__S3__ServiceUrl: ${WORKSPACE_STORAGE_S3_ENDPOINT:-http://minio:9000}
      Storage__S3__AccessKey: ${WORKSPACE_STORAGE_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-warptalk-admin}}
      Storage__S3__SecretKey: ${WORKSPACE_STORAGE_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-warptalk-s3-secretkey}} # gitleaks:allow
      Storage__S3__BucketName: ${MINIO_WORKSPACE_DOCUMENTS_BUCKET:-warptalk-workspace-documents}
      Storage__S3__EnsureBucketExists: ${WORKSPACE_STORAGE_ENSURE_BUCKET:-false}
      # Read-only: the workspace knowledge view scrolls this workspace's own collection.
      VectorDb__Url: ${VECTOR_DB_URL:-http://qdrant:6333}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-workspace-provisioner:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── TranslationRoom Service ───────────────────────────────────────────────
  translation-room-service:
    build:
      context: ../warptalk-backend
      dockerfile: translation-room/Dockerfile
    container_name: warptalk-translation-room
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__TranslationRoomDb: "Host=pgbouncer;Port=6432;Database=warptalk_translation_room;Username=warptalk_translation_room;Password=${TRANSLATION_ROOM_DB_PASSWORD:-warptalk-translation-room-dev};Search Path=translation_room,public;GSS Encryption Mode=Disable"
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:3000}
      GrpcSettings__AuthServiceUrl: "http://auth-service:50051"
      GrpcSettings__NotificationServiceUrl: "http://notification-service:50054"
      GrpcSettings__TranscriptServiceUrl: "http://transcript-service:50055"
      GrpcSettings__WorkspaceServiceUrl: "http://workspace-service:50056"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Transcript Service ────────────────────────────────────────────
  transcript-service:
    build:
      context: ../warptalk-backend
      dockerfile: transcript/Dockerfile
    container_name: warptalk-transcript
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__TranscriptDb: "Host=pgbouncer;Port=6432;Database=warptalk_transcript;Username=warptalk_transcript;Password=${TRANSCRIPT_DB_PASSWORD};Search Path=transcript,public;GSS Encryption Mode=Disable"
      GrpcUrls__AuthServiceUrl: "http://auth-service:50051"
      GrpcUrls__WorkspaceServiceUrl: "http://workspace-service:50056"
      GrpcUrls__TranslationRoomServiceUrl: "http://translation-room-service:50052"
      GrpcUrls__BillingServiceUrl: "http://billing-service:50057"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      workspace-service:
        condition: service_started
      translation-room-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Notification Service ──────────────────────────────────────────
  notification-service:
    build:
      context: ../warptalk-backend
      dockerfile: notification/Dockerfile
    container_name: warptalk-notification
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=6432;Database=warptalk_notification;Username=warptalk_notification;Password=${NOTIFICATION_DB_PASSWORD};Search Path=notification,public;GSS Encryption Mode=Disable"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-warptalk}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-warptalk-dev-rabbitmq}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - warptalk-net

  # ── Meeting Service ───────────────────────────────────────────────
  meeting-service:
    build:
      context: ../warptalk-backend
      dockerfile: meeting/Dockerfile
    container_name: warptalk-meeting
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=6432;Database=warptalk_meeting;Username=warptalk_meeting;Password=${MEETING_DB_PASSWORD};Search Path=meeting,public;GSS Encryption Mode=Disable"
      GrpcUrls__TranslationRoomService: "http://translation-room-service:50052"
      GrpcUrls__BillingService: "http://billing-service:50057"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      LiveKit__Url: ${LIVEKIT_URL:?Set LIVEKIT_URL to the LiveKit Cloud project URL}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET}
      LiveKit__Egress__S3__AccessKey: ${LIVEKIT_EGRESS_S3_ACCESS_KEY:-}
      LiveKit__Egress__S3__Secret: ${LIVEKIT_EGRESS_S3_SECRET:-}
      LiveKit__Egress__S3__Bucket: ${LIVEKIT_EGRESS_S3_BUCKET:-}
      LiveKit__Egress__S3__Region: ${LIVEKIT_EGRESS_S3_REGION:-}
      LiveKit__Egress__S3__Endpoint: ${LIVEKIT_EGRESS_S3_ENDPOINT:-}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__ChatTranslationModel: ${OPENAI_CHAT_TRANSLATION_MODEL:-gpt-4o-mini}
      Storage__Provider: ${MEETING_CHAT_STORAGE_PROVIDER:-MinIO}
      Storage__S3__ServiceUrl: ${MEETING_CHAT_STORAGE_S3_ENDPOINT:-http://minio:9000}
      Storage__S3__AccessKey: ${MINIO_ROOT_USER:-warptalk-admin}
      Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD:-warptalk-s3-secretkey} # gitleaks:allow
      Storage__S3__BucketName: ${MINIO_MEETING_CHAT_BUCKET:-warptalk-meeting-chat}
      Storage__S3__EnsureBucketExists: ${MEETING_CHAT_STORAGE_ENSURE_BUCKET:-false}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      minio-workspace-provisioner:
        condition: service_completed_successfully
      translation-room-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Assistant Service ─────────────────────────────────────────────
  assistant-service:
    build:
      context: ../warptalk-backend
      dockerfile: assistant/Dockerfile
    container_name: warptalk-assistant
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__AssistantDb: "Host=pgbouncer;Port=6432;Database=warptalk_assistant;Username=warptalk_assistant;Password=${ASSISTANT_DB_PASSWORD:-warptalk-assistant-dev};Search Path=assistant,public;GSS Encryption Mode=Disable"
      Jwt__SecretKey: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - warptalk-net

  # ── API Gateway (YARP + SignalR) ──────────────────────────────────
  gateway:
    build:
      context: ../warptalk-backend
      dockerfile: gateway/src/WarpTalk.Gateway/Dockerfile
    container_name: warptalk-gateway
    ports:
      - "5200:5200"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ASPNETCORE_URLS: "http://0.0.0.0:5200"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: "http://auth-service:5101"
      ReverseProxy__Clusters__translation-room-cluster__Destinations__translation-room-service__Address: "http://translation-room-service:5102"
      ReverseProxy__Clusters__transcript-cluster__Destinations__transcript-service__Address: "http://transcript-service:5103"
      ReverseProxy__Clusters__notification-cluster__Destinations__notification-service__Address: "http://notification-service:5104"
      ReverseProxy__Clusters__meeting-cluster__Destinations__meeting-service__Address: "http://meeting-service:5105"
      ReverseProxy__Clusters__workspace-cluster__Destinations__workspace-service__Address: "http://workspace-service:5106"
      ReverseProxy__Clusters__billing-cluster__Destinations__billing-service__Address: "http://billing-service:5107"
      ReverseProxy__Clusters__assistant-cluster__Destinations__assistant-service__Address: "http://assistant-service:5108"
      GrpcUrls__NotificationServiceUrl: "http://notification-service:50054"
      GrpcUrls__WorkspaceServiceUrl: "http://workspace-service:50056"
      GrpcUrls__TranslationRoomServiceUrl: "http://translation-room-service:50052"
      AllowedOrigins__0: ${ALLOWED_ORIGINS:-http://localhost:3000}
      RateLimits__IpPermitLimit: ${RATE_LIMIT_IP_PER_WINDOW:-300}
      RateLimits__UserPermitLimit: ${RATE_LIMIT_USER_PER_WINDOW:-180}
      RateLimits__WorkspacePermitLimit: ${RATE_LIMIT_WORKSPACE_PER_WINDOW:-1000}
      RateLimits__LoginPermitLimit: ${RATE_LIMIT_LOGIN_PER_WINDOW:-5}
      RateLimits__InboxPermitLimit: ${RATE_LIMIT_INBOX_PER_WINDOW:-30}
      RateLimits__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      auth-service:
        condition: service_started
      workspace-service:
        condition: service_started
      translation-room-service:
        condition: service_started
      transcript-service:
        condition: service_started
      notification-service:
        condition: service_started
      meeting-service:
        condition: service_started
      billing-service:
        condition: service_started
      assistant-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Billing Service ───────────────────────────────────────────────
  billing-service:
    build:
      context: ../warptalk-backend
      dockerfile: billing/Dockerfile
    container_name: warptalk-billing
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__BillingDb: "Host=pgbouncer;Port=6432;Database=warptalk_billing;Username=warptalk_billing;Password=${SUBSCRIPTION_DB_PASSWORD};Search Path=subscription,public;GSS Encryption Mode=Disable"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-warptalk}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-warptalk-dev-rabbitmq}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Grpc__InternalSecret: ${GRPC_INTERNAL_SECRET:?Set GRPC_INTERNAL_SECRET in .env}
      GrpcUrls__AuthServiceUrl: "http://auth-service:50051"
      GrpcUrls__WorkspaceServiceUrl: "http://workspace-service:50056"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__SuccessUrl: ${STRIPE_SUCCESS_URL:-http://localhost:3000/workspace/payment/success?session_id={CHECKOUT_SESSION_ID}}
      Stripe__CancelUrl: ${STRIPE_CANCEL_URL:-http://localhost:3000/workspace/payment/plans}
      Billing__Workers__SessionMonitorIntervalSeconds: ${BILLING_SESSION_MONITOR_INTERVAL_SECONDS:-5}
      Billing__Workers__SubscriptionExpirationIntervalMinutes: ${BILLING_SUBSCRIPTION_EXPIRATION_INTERVAL_MINUTES:-60}
      Billing__Workers__SubscriptionRenewalLookbackHours: ${BILLING_SUBSCRIPTION_RENEWAL_LOOKBACK_HOURS:-24}
      Billing__Workers__DailyAuditHourUtc: ${BILLING_DAILY_AUDIT_HOUR_UTC:-0}
      Billing__Workers__BillingAggregationIntervalSeconds: ${BILLING_AGGREGATION_INTERVAL_SECONDS:-10}
      Billing__Workers__BillingAggregationBatchSize: ${BILLING_AGGREGATION_BATCH_SIZE:-1000}
      Billing__Workers__BillingCycleIntervalMinutes: ${BILLING_CYCLE_INTERVAL_MINUTES:-60}
      Billing__Workers__InvoiceOverdueIntervalMinutes: ${BILLING_INVOICE_OVERDUE_INTERVAL_MINUTES:-60}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      workspace-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Frontend — Next.js Web App ─────────────────────────────────────
  frontend:
    build:
      context: ../warptalk-web
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:5200/api/v1}
        NEXT_PUBLIC_SIGNALR_URL: ${FRONTEND_SIGNALR_URL:-http://localhost:5200}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_LIVEKIT_URL: ${FRONTEND_LIVEKIT_URL:?Set FRONTEND_LIVEKIT_URL to the LiveKit Cloud project URL}
    container_name: warptalk-frontend
    environment:
      # Server-side (Server Components/Actions) calls run inside this container,
      # so they must hit the gateway by its service name, not the browser-facing
      # localhost URLs baked into the client bundle above.
      API_GATEWAY_URL: "http://gateway:5200"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      gateway:
        condition: service_started
    networks:
      - warptalk-net

  # ── COTURN Primary — TURN/STUN for WebRTC ─────────────────────────
  coturn-primary:
    profiles: ["selfhost"]
    image: coturn/coturn:4.15.0-r0@sha256:0feee4fc1f45c7c053c8fee3e1ab941b1a1b9a0429bc01e18126735410770bfd
    container_name: warptalk-coturn-primary
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_SECRET: ${TURN_SECRET}
      TURN_REALM: ${TURN_REALM:-warptalk.io.vn}
    networks:
      - warptalk-net

  # ── COTURN Backup — Failover ──────────────────────────────────────
  coturn-backup:
    profiles: ["selfhost"]
    image: coturn/coturn:4.15.0-r0@sha256:0feee4fc1f45c7c053c8fee3e1ab941b1a1b9a0429bc01e18126735410770bfd
    container_name: warptalk-coturn-backup
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_SECRET: ${TURN_SECRET}
      TURN_REALM: ${TURN_REALM:-warptalk.io.vn}
    networks:
      - warptalk-net

  # ── OpenTelemetry Collector ───────────────────────────────────────
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    container_name: warptalk-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      seq:
        condition: service_started
    networks:
      - warptalk-net

  # ── PostgreSQL / Redis / Stream metrics exporters ────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
    container_name: warptalk-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-warptalk}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - warptalk-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0@sha256:7ef8e9c26638158fa4e7ad60df8c7e53d1919986753d6c1d2d1876b6ec38d87b
    container_name: warptalk-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - warptalk-net

  metrics-exporter:
    build:
      context: ../warptalk-ai
      target: metrics
    container_name: warptalk-metrics-exporter
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      METRICS_PORT: "9108"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:9108/health/ready", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - warptalk-net

  billing-cost-exporter:
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    container_name: warptalk-billing-cost-exporter
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9188
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD}@postgres:5432/warptalk_billing?sslmode=disable
    volumes:
      - ./observability/billing-cost-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - warptalk-net

  livekit-cost-exporter:
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    container_name: warptalk-livekit-cost-exporter
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9189
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD}@postgres:5432/warptalk_translation_room?sslmode=disable
    volumes:
      - ./observability/livekit-cost-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - warptalk-net

  workspace-storage-exporter:
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    container_name: warptalk-workspace-storage-exporter
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9190
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD}@postgres:5432/warptalk_workspace?sslmode=disable
    volumes:
      - ./observability/workspace-storage-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - warptalk-net

  # ── Seq — Centralized Logging ─────────────────────────────────────
  seq:
    image: datalust/seq:2025.2.16202@sha256:868a12e93ec0b8c993767a7dd4cd6c8ebc441511c79e4cfac66c911f62d4db65
    container_name: warptalk-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq-data:/data
    networks:
      - warptalk-net

  # ── Prometheus — Metrics ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: warptalk-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - alertmanager
      - otel-collector
      - postgres-exporter
      - redis-exporter
      - metrics-exporter
      - billing-cost-exporter
      - livekit-cost-exporter
      - workspace-storage-exporter
    networks:
      - warptalk-net

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    container_name: warptalk-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.local.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - warptalk-net

  # ── Grafana — Dashboards ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: warptalk-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - warptalk-net

  # ── LiveKit — WebRTC SFU (clients connect here for A/V) ────────────
  livekit:
    profiles: ["selfhost"]
    image: livekit/livekit-server:v1.13.0@sha256:e07c51c497c116f8503bfecfc1a58e4504adb4cdcd6542bea64e489154b5db89
    container_name: warptalk-livekit
    command: --dev --bind 0.0.0.0
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    networks:
      - warptalk-net

volumes:
  pgdata:
  redis-data:
  rabbitmq-data:
  minio-data:
  seq-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  warptalk-net:
    driver: bridge
