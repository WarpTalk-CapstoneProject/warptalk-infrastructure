# ====================================================================
# WarpTalk — Full Stack Docker Compose (Base)
# Override with docker-compose.dev.yml or docker-compose.prod.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ====================================================================

services:

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: warptalk-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warptalk}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - warptalk-net

  # ── Migrator — applies scripts/migrations/*.sql, in chronological order,
  #    before any service that needs the DB starts. One-shot: runs to
  #    completion and exits; see scripts/run-migrations.sh for the ordering
  #    logic and why plain alphabetical sort of the filenames is unsafe.
  migrator:
    image: postgres:18-alpine
    container_name: warptalk-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-warptalk}
      MIGRATIONS_DIR: /scripts/migrations
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/run-migrations.sh | sh -s -- /scripts/run-migrations.sh"]
    networks:
      - warptalk-net

  # ── PgBouncer — Connection Pooling ────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: warptalk-pgbouncer
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-warptalk}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      IGNORE_STARTUP_PARAMETERS: extra_float_digits, search_path
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - warptalk-net

  # ── Redis — Cache + Streams ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: warptalk-redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - warptalk-net

  # ── RabbitMQ — Durable domain events ─────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: warptalk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-warptalk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-warptalk-dev-rabbitmq}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  # ── MinIO — S3 Compatible Object Storage ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: warptalk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-warptalk-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-warptalk-s3-secretkey}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - warptalk-net

  minio-workspace-provisioner:
    image: minio/mc:latest
    container_name: warptalk-minio-workspace-provisioner
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_WORKSPACE_DOCUMENTS_BUCKET:-warptalk-workspace-documents}" &&
        mc anonymous set none "local/$${MINIO_WORKSPACE_DOCUMENTS_BUCKET:-warptalk-workspace-documents}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-warptalk-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-warptalk-s3-secretkey}
      MINIO_WORKSPACE_DOCUMENTS_BUCKET: ${MINIO_WORKSPACE_DOCUMENTS_BUCKET:-warptalk-workspace-documents}
    networks:
      - warptalk-net

  # ── Auth Service ──────────────────────────────────────────────────
  auth-service:
    build:
      context: ../warptalk-backend
      dockerfile: auth/Dockerfile
    container_name: warptalk-auth
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__AuthDb: "Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-warptalk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=auth,public"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - warptalk-net

  # ── Workspace Service ─────────────────────────────────────────────
  workspace-service:
    build:
      context: ../warptalk-backend
      dockerfile: workspace/Dockerfile
    container_name: warptalk-workspace
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__WorkspaceDb: "Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-warptalk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=workspace,public"
      GrpcSettings__AuthServiceUrl: "http://auth-service:50051"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__Username: ${RABBITMQ_USERNAME:-warptalk}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-warptalk-dev-rabbitmq}
      Storage__Provider: ${WORKSPACE_STORAGE_PROVIDER:-MinIO}
      Storage__MasterKey: ${WORKSPACE_STORAGE_MASTER_KEY}
      Storage__S3__ServiceUrl: ${WORKSPACE_STORAGE_S3_ENDPOINT:-http://minio:9000}
      Storage__S3__AccessKey: ${MINIO_ROOT_USER:-warptalk-admin}
      Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD:-warptalk-s3-secretkey}
      Storage__S3__BucketName: ${MINIO_WORKSPACE_DOCUMENTS_BUCKET:-warptalk-workspace-documents}
      Storage__S3__EnsureBucketExists: ${WORKSPACE_STORAGE_ENSURE_BUCKET:-false}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-workspace-provisioner:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── TranslationRoom Service ───────────────────────────────────────────────
  translation-room-service:
    build:
      context: ../warptalk-backend
      dockerfile: translation-room/Dockerfile
    container_name: warptalk-translation-room
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__TranslationRoomDb: "Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-warptalk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=translation_room,public"
      GrpcSettings__AuthServiceUrl: "http://auth-service:50051"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Transcript Service ────────────────────────────────────────────
  transcript-service:
    build:
      context: ../warptalk-backend
      dockerfile: transcript/Dockerfile
    container_name: warptalk-transcript
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__TranscriptDb: "Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-warptalk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=transcript,public"
      GrpcUrls__AuthServiceUrl: "http://auth-service:50051"
      GrpcUrls__TranslationRoomServiceUrl: "http://translation-room-service:50052"
      GrpcUrls__BillingServiceUrl: "http://billing-service:50057"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      translation-room-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Notification Service ──────────────────────────────────────────
  notification-service:
    build:
      context: ../warptalk-backend
      dockerfile: notification/Dockerfile
    container_name: warptalk-notification
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-warptalk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=notification,public"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - warptalk-net

  # ── Meeting Service ───────────────────────────────────────────────
  meeting-service:
    build:
      context: ../warptalk-backend
      dockerfile: meeting/Dockerfile
    container_name: warptalk-meeting
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-warptalk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=meeting,public"
      GrpcUrls__TranslationRoomService: "http://translation-room-service:50052"
      GrpcUrls__BillingService: "http://billing-service:50057"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__ChatTranslationModel: ${OPENAI_CHAT_TRANSLATION_MODEL:-gpt-4o-mini}
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      translation-room-service:
        condition: service_started
    networks:
      - warptalk-net


  # ── Assistant Service ─────────────────────────────────────────────
  assistant-service:
    build:
      context: ../warptalk-backend
      dockerfile: assistant/Dockerfile
    container_name: warptalk-assistant
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__AssistantDb: "Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-warptalk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=assistant,public"
      Jwt__SecretKey: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - warptalk-net

  # ── API Gateway (YARP + SignalR) ──────────────────────────────────
  gateway:
    build:
      context: ../warptalk-backend
      dockerfile: gateway/src/WarpTalk.Gateway/Dockerfile
    container_name: warptalk-gateway
    ports:
      - "5200:5200"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ASPNETCORE_URLS: "http://0.0.0.0:5200"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: "http://auth-service:5101"
      ReverseProxy__Clusters__translation-room-cluster__Destinations__translation-room-service__Address: "http://translation-room-service:5102"
      ReverseProxy__Clusters__transcript-cluster__Destinations__transcript-service__Address: "http://transcript-service:5103"
      ReverseProxy__Clusters__notification-cluster__Destinations__notification-service__Address: "http://notification-service:5104"
      ReverseProxy__Clusters__meeting-cluster__Destinations__meeting-service__Address: "http://meeting-service:5105"
      ReverseProxy__Clusters__workspace-cluster__Destinations__workspace-service__Address: "http://workspace-service:5106"
      ReverseProxy__Clusters__billing-cluster__Destinations__billing-service__Address: "http://billing-service:5107"
      ReverseProxy__Clusters__payment-cluster__Destinations__payment-service__Address: "http://payment-service:8080"
      ReverseProxy__Clusters__assistant-cluster__Destinations__assistant-service__Address: "http://assistant-service:5108"
      GrpcUrls__NotificationServiceUrl: "http://notification-service:50054"
      GrpcUrls__WorkspaceServiceUrl: "http://workspace-service:50056"
      GrpcUrls__TranslationRoomServiceUrl: "http://translation-room-service:50052"
      AllowedOrigins__0: ${ALLOWED_ORIGINS:-http://localhost:3000}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      auth-service:
        condition: service_started
      workspace-service:
        condition: service_started
      translation-room-service:
        condition: service_started
      transcript-service:
        condition: service_started
      notification-service:
        condition: service_started
      meeting-service:
        condition: service_started
      billing-service:
        condition: service_started
      payment-service:
        condition: service_started
      assistant-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Billing Service ───────────────────────────────────────────────
  billing-service:
    build:
      context: ../warptalk-backend
      dockerfile: billing/Dockerfile
    container_name: warptalk-billing
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      ConnectionStrings__BillingDb: "Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-warptalk};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=subscription,workspace,public"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-WarpTalk.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-WarpTalk}
      GrpcUrls__AuthServiceUrl: "http://auth-service:50051"
      PaymentServiceGrpcUrl: "http://payment-service:50058"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - warptalk-net

  # ── Payment Service (Stripe integration) ──────────────────────────
  payment-service:
    image: alpine:latest
    container_name: warptalk-payment
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Development}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
    networks:
      - warptalk-net

  # ── Frontend — Next.js Web App ─────────────────────────────────────
  frontend:
    build:
      context: ../warptalk-web
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:5200/api/v1}
        NEXT_PUBLIC_SIGNALR_URL: ${FRONTEND_SIGNALR_URL:-http://localhost:5200}
        NEXT_PUBLIC_LIVEKIT_URL: ${FRONTEND_LIVEKIT_URL:-ws://localhost:7880}
    container_name: warptalk-frontend
    environment:
      # Server-side (Server Components/Actions) calls run inside this container,
      # so they must hit the gateway by its service name, not the browser-facing
      # localhost URLs baked into the client bundle above.
      API_GATEWAY_URL: "http://gateway:5200"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - warptalk-net

  # ── COTURN Primary — TURN/STUN for WebRTC ─────────────────────────
  coturn-primary:
    image: coturn/coturn:latest
    container_name: warptalk-coturn-primary
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_SECRET: ${TURN_SECRET}
      TURN_REALM: ${TURN_REALM:-warptalk.vn}
    networks:
      - warptalk-net

  # ── COTURN Backup — Failover ──────────────────────────────────────
  coturn-backup:
    image: coturn/coturn:latest
    container_name: warptalk-coturn-backup
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_SECRET: ${TURN_SECRET}
      TURN_REALM: ${TURN_REALM:-warptalk.vn}
    networks:
      - warptalk-net

  # ── Seq — Centralized Logging ─────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: warptalk-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq-data:/data
    networks:
      - warptalk-net

  # ── Prometheus — Metrics ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: warptalk-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - warptalk-net

  # ── Grafana — Dashboards ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: warptalk-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - warptalk-net

  # ── LiveKit — WebRTC SFU (clients connect here for A/V) ────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: warptalk-livekit
    command: --dev --bind 0.0.0.0
    environment:
      - "LIVEKIT_KEYS=APIBVnfFo9PzzoQ: wbB6j98H2jfF5nLTZYhaiYXQM8hM6nB3KoVoXfMNTPA"
    networks:
      - warptalk-net

volumes:
  pgdata:
  redis-data:
  rabbitmq-data:
  minio-data:
  seq-data:
  prometheus-data:
  grafana-data:

networks:
  warptalk-net:
    driver: bridge
