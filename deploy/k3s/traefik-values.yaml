deployment:
  replicas: 3
podDisruptionBudget:
  enabled: true
  minAvailable: 2
service:
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
