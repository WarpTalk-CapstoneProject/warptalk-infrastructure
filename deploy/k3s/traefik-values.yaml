# Traefik for the WarpTalk cluster (chart traefik/traefik, version locked in addons.lock.env; the
# lock follows the 41.6.0 release that production actually runs).
#
# Ingress path, as verified on production (2026-09-23): the public address is NATed to the App VM,
# and Traefik takes :80/:443 there with HOST PORTS; the MetalLB LoadBalancer address (10.20.0.100)
# is not what the Internet reaches. Host-port traffic is DNATed by the CNI portmap plugin without
# SNAT, so Traefik sees the real client address; the gateway then trusts X-Forwarded-For only from
# the pod CIDR (network.podCidrs), which is what makes per-IP rate limits mean one client.
#
# Replicas: a host port admits one Traefik pod per node, and only the App VM receives public
# traffic. A second replica therefore needs a second ingress-capable node (a public address and a
# node.warptalk.io/role=app label); until then it is ONE pod, rolled with maxSurge 0 (a surge pod
# could never bind :80 next to the old one). See deploy/k3s/README.md "Ingress path".
deployment:
  kind: Deployment
  replicas: 1
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
# A PDB over one pod either allows everything or blocks every drain; none.
podDisruptionBudget:
  enabled: false
autoscaling:
  enabled: false

nodeSelector:
  node.warptalk.io/role: app
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 300m, memory: 256Mi}

log:
  level: INFO

# Access logs without secrets. The SignalR client sends its bearer token as ?access_token= on
# the WebSocket upgrade (a browser cannot set headers there), so a RequestPath with its query
# string is a log line full of live JWTs. Every query parameter is dropped from RequestPath, and
# every header is dropped (the default, restated so nobody flips it to keep Authorization).
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
    queryParameters:
      defaultMode: drop

ports:
  web:
    port: 8000
    hostPort: 80
    exposedPort: 80
    # Every plain-HTTP request is redirected to HTTPS, except ACME HTTP-01 challenges, which
    # cert-manager's solver must be able to answer on :80.
    allowACMEByPass: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    hostPort: 443
    exposedPort: 443
    http:
      tls:
        enabled: true

service:
  spec:
    type: LoadBalancer
    # The in-VPC LoadBalancer path keeps the client address too.
    externalTrafficPolicy: Local
