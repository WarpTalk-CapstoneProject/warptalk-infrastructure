apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: warptalk-rabbitmq
  namespace: {{ .Values.rabbitmq.namespace }}
spec:
  replicas: {{ .Values.rabbitmq.replicas }}
  persistence:
    storageClassName: {{ .Values.storageClass }}
    storage: {{ .Values.rabbitmq.storageSize }}
  resources:
    {{- toYaml .Values.rabbitmq.resources | nindent 4 }}
  rabbitmq:
    additionalConfig: |
      cluster_partition_handling = pause_minority
      default_queue_type = quorum
      quorum_queue.property_equivalence.relaxed_checks_on_redeclaration = true
      consumer_timeout = 900000
  override:
    statefulSet:
      spec:
        template:
          metadata:
            labels:
              warptalk.io/component: rabbitmq
          spec:
            # Required by the RabbitmqCluster CRD whenever the override pod template has a spec.
            # The operator merges its own rabbitmq container in; an empty list adds nothing. Without
            # it the first k8s release (run 35946575671) was rejected with
            # "spec.override.statefulSet.spec.template.spec.containers: Required value".
            containers: []
            {{- with .Values.rabbitmq.priorityClassName }}
            priorityClassName: {{ . }}
            {{- end }}
            {{- with .Values.placement.nodeSelector }}
            nodeSelector:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.placement.tolerations }}
            tolerations:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.placement.preferredRole }}
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node.warptalk.io/role
                          operator: In
                          values: [{{ . }}]
            {{- end }}
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    warptalk.io/component: rabbitmq
