apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: warptalk-rabbitmq
  namespace: {{ .Values.rabbitmq.namespace }}
spec:
  replicas: {{ .Values.rabbitmq.replicas }}
  persistence:
    storageClassName: {{ .Values.storageClass }}
    storage: {{ .Values.rabbitmq.storageSize }}
  resources:
    {{- toYaml .Values.rabbitmq.resources | nindent 4 }}
  rabbitmq:
    additionalConfig: |
      cluster_partition_handling = pause_minority
      default_queue_type = quorum
      quorum_queue.property_equivalence.relaxed_checks_on_redeclaration = true
      consumer_timeout = 900000
  override:
    statefulSet:
      spec:
        template:
          metadata:
            labels:
              warptalk.io/component: rabbitmq
          spec:
            {{- with .Values.placement.nodeSelector }}
            nodeSelector:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.placement.tolerations }}
            tolerations:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    warptalk.io/component: rabbitmq
