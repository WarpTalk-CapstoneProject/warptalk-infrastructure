apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warptalk-postgres-superuser
  namespace: {{ .Values.postgres.namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: warptalk-postgres-superuser
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.postgresRemoteKey }}
