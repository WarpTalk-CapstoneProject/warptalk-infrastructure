apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: warptalk-postgres-backup
  namespace: {{ .Values.postgres.namespace }}
spec:
  configuration:
    destinationPath: {{ required "postgres.backup.destinationPath is required" .Values.postgres.backup.destinationPath | quote }}
    endpointURL: {{ required "postgres.backup.endpointURL is required" .Values.postgres.backup.endpointURL | quote }}
    s3Credentials:
      accessKeyId:
        name: warptalk-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: warptalk-backup-credentials
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip
      jobs: 2
  retentionPolicy: {{ .Values.postgres.backup.retentionPolicy }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: warptalk-postgres
  namespace: {{ .Values.postgres.namespace }}
spec:
  instances: {{ .Values.postgres.instances }}
  primaryUpdateStrategy: unsupervised
  failoverDelay: 30
  switchoverDelay: 60
  smartShutdownTimeout: 30
  stopDelay: 300
  storage:
    size: {{ .Values.postgres.storageSize }}
    storageClass: {{ .Values.storageClass }}
  {{- with .Values.placement }}
  affinity:
    {{- with .nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .preferredRole }}
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.warptalk.io/role
                operator: In
                values: [{{ . }}]
    {{- end }}
  {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: warptalk-postgres-superuser
  superuserSecret:
    name: warptalk-postgres-superuser
  enableSuperuserAccess: true
  postgresql:
    {{- with .Values.postgres.synchronous }}
    synchronous:
      method: {{ .method }}
      number: {{ .number }}
      dataDurability: {{ .dataDurability }}
    {{- end }}
    parameters:
      {{- range $key, $value := .Values.postgres.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
      # pg_stat_statements, which enable-postgres-performance-observability.sh and
      # report-postgres-performance.sh read. CloudNativePG manages shared_preload_libraries
      # itself and rejects it as a parameter (why it was dropped); setting any
      # pg_stat_statements.* option is how it is told to preload the library.
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      max_connections: "200"
      wal_level: replica
      archive_timeout: 5min
      max_wal_senders: "10"
      max_replication_slots: "10"
      log_min_duration_statement: "500"
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: warptalk-postgres-backup
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: warptalk-postgres-pooler-rw
  namespace: {{ .Values.postgres.namespace }}
spec:
  cluster:
    name: warptalk-postgres
  instances: {{ .Values.postgres.pooler.instances }}
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ .Values.postgres.pooler.maxClientConnections | quote }}
      default_pool_size: {{ .Values.postgres.pooler.defaultPoolSize | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warptalk-postgres-pooler
    spec:
      {{- with .Values.placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: {{ .Values.postgres.pooler.resources.requests.cpu | quote }}
              memory: {{ .Values.postgres.pooler.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.postgres.pooler.resources.limits.cpu | quote }}
              memory: {{ .Values.postgres.pooler.resources.limits.memory | quote }}
      affinity:
        {{- with .Values.placement.preferredRole }}
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.warptalk.io/role
                    operator: In
                    values: [{{ . }}]
        {{- end }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: warptalk-postgres-pooler
                topologyKey: kubernetes.io/hostname
{{- if ge (int .Values.postgres.pooler.instances) 2 }}
---
# Only with two or more poolers; over a single pod a PDB either allows everything or blocks
# every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: warptalk-postgres-pooler
  namespace: {{ .Values.postgres.namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warptalk-postgres-pooler
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: warptalk-postgres-daily
  namespace: {{ .Values.postgres.namespace }}
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: warptalk-postgres
