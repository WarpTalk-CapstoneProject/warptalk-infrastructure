apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warptalk-data-default-deny-ingress
  namespace: {{ .Values.postgres.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warptalk-data-allow-trusted-namespaces
  namespace: {{ .Values.postgres.namespace }}
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.postgres.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.rabbitmq.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warptalk-rabbitmq-allow-cluster-and-clients
  namespace: {{ .Values.rabbitmq.namespace }}
spec:
  podSelector:
    matchLabels:
      warptalk.io/component: rabbitmq
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.rabbitmq.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  policyTypes: [Ingress]
