replicaCount: 3
image:
  tag: v1.18.2
apiKey:
  valueFrom:
    secretKeyRef:
      name: warptalk-qdrant-auth
      key: api-key
config:
  cluster:
    enabled: true
  storage:
    performance:
      max_search_threads: 4
persistence:
  accessModes: [ReadWriteOnce]
  size: 50Gi
  storageClassName: replicated-nvme
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: qdrant
metrics:
  serviceMonitor:
    enabled: true
chartTests:
  dbInteraction:
    image: registry.suse.com/bci/bci-base@sha256:4a0d40a2c4b0b9c1e58fd270e4030d4defb385ffbfcf70f25493283193042d4d
