# One Qdrant node on the Data VM. Cluster mode needs three peers for Raft quorum, and three peers
# on one VM would cost three copies of the index for no protection against losing the VM; the
# nightly snapshot to object storage (qdrant-snapshots-s3.yaml) is the recovery path instead.
replicaCount: 1
image:
  tag: v1.18.2
apiKey:
  valueFrom:
    secretKeyRef:
      name: warptalk-qdrant-auth
      key: api-key
config:
  cluster:
    enabled: false
  storage:
    performance:
      max_search_threads: 2
resources:
  # Measured 19 MiB working set on 2026-09-23 (a nearly empty index); compose allowed 2G.
  requests: {cpu: 50m, memory: 256Mi}
  limits: {cpu: 500m, memory: 1Gi}
persistence:
  accessModes: [ReadWriteOnce]
  # Live claim size (immutable volumeClaimTemplate).
  size: 50Gi
  storageClassName: replicated-nvme
podDisruptionBudget:
  enabled: false
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node.warptalk.io/role
              operator: In
              values: [data]
tolerations:
  - key: node.warptalk.io/role
    operator: Equal
    value: data
    effect: NoSchedule
metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
chartTests:
  dbInteraction:
    image: registry.suse.com/bci/bci-base@sha256:4a0d40a2c4b0b9c1e58fd270e4030d4defb385ffbfcf70f25493283193042d4d
