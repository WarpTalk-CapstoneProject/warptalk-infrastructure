kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: warptalk-local
nodes:
  - role: control-plane
    labels:
      node-role.kubernetes.io/control-plane: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    labels:
      node-role.kubernetes.io/worker: "true"
      node.warptalk.io/role: "app"
  - role: worker
    labels:
      node.warptalk.io/role: "data"
