# Production data-platform values: CloudNativePG + PgBouncer and RabbitMQ.
# Redis and Qdrant are separate Helm releases configured by deploy/k3s/data/redis-values.yaml
# and deploy/k3s/data/qdrant-values.yaml (a `redis:` block here was never read by anything).
#
# Intended for the ONE Data VM (2 vCPU / 8 GiB, 35 GB volume at /srv/warptalk). Verified live on
# 2026-09-23: both Postgres instances, redis-node-0 and RabbitMQ actually run on the App node,
# because their local-path volumes were first bound there. Placement is therefore SOFT (prefer
# the Data node, tolerate its taint): a hard selector would leave those pods Pending next to
# volumes they cannot leave. Moving them is a runbook step (deploy/k3s/README.md "Data layer").

placement:
  preferredRole: data
  tolerations:
    - key: node.warptalk.io/role
      operator: Equal
      value: data
      effect: NoSchedule

# The four data-namespace secrets (postgres superuser, backup credentials, redis auth, qdrant
# auth) are written by the release job from the GitHub `production` environment.
externalSecrets:
  enabled: false
  secretStoreName: warptalk-production-secret-store
  postgresRemoteKey: warptalk/production/postgres-superuser
  backupRemoteKey: warptalk/production/postgres-backup
  redisRemoteKey: warptalk/production/redis
  qdrantRemoteKey: warptalk/production/qdrant

postgres:
  # Two instances with `preferred` durability. Both live on the same Data VM, so a third would buy
  # no protection against losing the machine - it would only spend ~1 GiB of the node's 8 on a
  # second copy of the same failure domain. Two still covers what one VM CAN survive: a crashed
  # or corrupted instance, and a rolling Postgres update without downtime. `preferred` is what
  # makes two safe: with `required` (the old minSyncReplicas: 1) every commit waits for the
  # standby, so the standby restarting would stop all writes. Losing the VM itself is covered by
  # the WAL archive and nightly base backup in object storage (RPO ~5 min, archive_timeout).
  instances: 2
  synchronous:
    method: any
    number: 1
    dataDurability: preferred
  # The size the live claims were created with. A PVC cannot shrink and CloudNativePG rejects a
  # smaller spec, so this can only grow. local-path does not enforce it; actual use is ~0.3 GiB.
  storageSize: 25Gi
  # Data tier outranks the application tier (data-chart/templates/priority-class.yaml). Safe to
  # assign in a release: CloudNativePG rolls the standby first and then SWITCHES OVER (below), so
  # the primary never restarts in place.
  priorityClassName: warptalk-data-critical
  primaryUpdateMethod: switchover
  # Right-sized 2026-09-24 from Prometheus over the cluster's life (4.8 days): working set p95
  # 315Mi / max 402Mi (primary), 259Mi / 263Mi (standby); CPU p95 18m. The request was 1Gi each,
  # and both instances still sit on the App node, so this alone returns 1 GiB of App-node
  # requests. The database is ~0.3 GiB, so shared_buffers (512MB) cannot fill past it; raise the
  # request with the data, and keep the limit where it was.
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: 600m, memory: 2Gi}
  parameters:
    shared_buffers: 512MB
    effective_cache_size: 1GB
    maintenance_work_mem: 64MB
  pooler:
    instances: 1
    maxClientConnections: "1000"
    # Per database/user pair: nine service databases x 10 stays well inside max_connections 200
    # (and the WarpTalkPostgresConnectionsNearBudget alert at 160).
    defaultPoolSize: "10"
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 128Mi}
  backup:
    # The R2 token in warptalk-backup-credentials is scoped to the warptalk-recordings bucket only
    # (verified 2026-09-24: warptalk-backups answered AccessDenied, so WAL archiving failed from
    # 2026-09-19 and 9.8 GB of WAL piled up on the App node). Backups live under a _backups/ prefix
    # of the bucket the token can write; move them back if a dedicated backups token is issued.
    destinationPath: s3://warptalk-recordings/_backups/postgres
    # endpointURL is deliberately absent: it carries the object-store account id, so the release
    # job passes it from BACKUP_S3_ENDPOINT_URL in the GitHub `production` runtime env
    # (scripts/deploy-k3s-data.sh K3S_BACKUP_ENDPOINT_URL).
    retentionPolicy: 30d

rabbitmq:
  replicas: 1
  # Not yet: assigning a class restarts the only broker. Set it (with the request below cut to the
  # measured p95 117Mi x 1.3) in the RabbitMQ step of deploy/k3s/DATA-PLACEMENT-RUNBOOK.md.
  priorityClassName: ""
  # Live claim size; cannot shrink.
  storageSize: 5Gi
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: 500m, memory: 1Gi}

# Enabled by deploy-k3s-data.sh together with the Qdrant S3 snapshot storage
# (deploy/k3s/data/qdrant-snapshots-s3.yaml) once the backup credentials carry ENDPOINT_URL,
# i.e. when secrets come from K8S_RUNTIME_ENV.
qdrantSnapshots:
  enabled: false
