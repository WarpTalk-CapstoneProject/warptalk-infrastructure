# Production Kubernetes Data Helm Values
# Storage mapped to Data VM 35GB NVMe Volume at /srv/warptalk

externalSecrets:
  secretStoreName: warptalk-production-secret-store
  postgresRemoteKey: warptalk/production/postgres-superuser
  backupRemoteKey: warptalk/production/postgres-backup
  redisRemoteKey: warptalk/production/redis
  qdrantRemoteKey: warptalk/production/qdrant

postgres:
  instances: 2
  storageSize: 25Gi
  pooler:
    instances: 1
    maxClientConnections: "1000"
    defaultPoolSize: "20"
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  backup:
    destinationPath: s3://warptalk-backups/postgres
    endpointURL: https://330fda6ca031ea97293b02db8e62996d.r2.cloudflarestorage.com
    retentionPolicy: 30d

redis:
  sentinel:
    enabled: true
    replicas: 2
  storage:
    size: 5Gi
    storageClass: local-path

rabbitmq:
  replicas: 1
  storageSize: 5Gi
