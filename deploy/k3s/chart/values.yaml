global:
  production: false
  imageRegistry: ghcr.io/warptalk
  imageTag: replace-with-git-sha
  imagePullPolicy: IfNotPresent
  # Registry credentials for the WarpTalk images (ghcr.io). Production names warptalk-ghcr, which
  # the release job writes from GHCR_PULL_TOKEN; a public registry needs none.
  imagePullSecrets: []
  domain: app.example.com
  # The API host, exactly as production compose splits them: APP_DOMAIN serves the frontend,
  # API_DOMAIN the gateway, and every OAuth/MCP callback compose builds from ${API_DOMAIN} is
  # built from this. Empty means a single-host install: the app host also routes /api, /hubs
  # and /oauth/client-metadata to the gateway, and the callbacks use global.domain.
  apiDomain: ""
  # Set by the deploy from the release manifest's tag; never written in a values file.
  releaseId: local

# Where application pods may run. Empty here so kind and single-node clusters schedule anywhere;
# deploy/k3s/k8s-app-values.yaml pins them to the App node.
placement:
  nodeSelector: {}
  tolerations: []

network:
  # Pod CIDRs the gateway trusts X-Forwarded-For from (the Traefik pods live here). Must match
  # the cluster's --pod-network-cidr; see scripts/k8s-cluster-bootstrap.sh.
  podCidrs: []

secret:
  name: warptalk-runtime
  # Production materializes warptalk-runtime from the GitHub `production` environment in the
  # release job (scripts/materialize-k8s-runtime-secrets.sh) and sets this to false. External
  # Secrets stays available behind the flag for a cluster that has a real secret store.
  externalSecret:
    enabled: true
    secretStoreName: warptalk-production
    remoteKey: warptalk/production/runtime
    postgresRemoteKey: warptalk/production/postgres-superuser
    redisRemoteKey: warptalk/production/redis
    qdrantRemoteKey: warptalk/production/qdrant

migrator:
  imageRef: ""

# How the database migrations run.
#   hook     - a pre-install/pre-upgrade Helm hook (kind, local and contract installs).
#   external - the chart renders NO migration Job. scripts/deploy-k3s-release.sh renders it with
#              mode=job and runs it as its own step BEFORE `helm upgrade`, waits for it, and stops
#              the release with nothing rolled if it fails. Production uses this: a failed hook
#              under `helm --atomic` once left the new images running on an unmigrated schema.
#   job      - render the migration ServiceAccount + Job as plain objects (what the deploy script
#              asks for with --show-only templates/migration-job.yaml). Never set in a values file.
migrations:
  mode: hook

config:
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Issuer: WarpTalk.AuthService
  Jwt__Audience: WarpTalk
  GrpcUrls__AuthServiceUrl: http://auth-service:50051
  GrpcUrls__TranslationRoomServiceUrl: http://translation-room-service:50052
  GrpcUrls__TranslationRoomService: http://translation-room-service:50052
  GrpcUrls__BillingServiceUrl: http://billing-service:50057
  GrpcUrls__BillingService: http://billing-service:50057
  GrpcUrls__WorkspaceServiceUrl: http://workspace-service:50056
  GrpcUrls__NotificationServiceUrl: http://notification-service:50054
  GrpcUrls__TranscriptServiceUrl: http://transcript-service:50053
  GrpcSettings__AuthServiceUrl: http://auth-service:50051
  GrpcSettings__TranslationRoomServiceUrl: http://translation-room-service:50052
  GrpcSettings__BillingServiceUrl: http://billing-service:50057
  GrpcSettings__WorkspaceServiceUrl: http://workspace-service:50056
  GrpcSettings__NotificationServiceUrl: http://notification-service:50054
  GrpcSettings__TranscriptServiceUrl: http://transcript-service:50053
  Observability__Enabled: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://warptalk-otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  LOG_LEVEL: INFO
  REDIS_MAX_CONNECTIONS: "10"
  REDIS_STREAM_MAXLEN: "1000"
  REDIS_SENTINEL_URLS: redis://warptalk-redis.warptalk-data.svc.cluster.local:26379
  REDIS_SENTINEL_SERVICE_NAME: mymaster
  RabbitMq__Host: warptalk-rabbitmq.warptalk.svc.cluster.local
  RabbitMq__VirtualHost: /
  VECTOR_DB_URL: http://warptalk-qdrant.warptalk-data.svc.cluster.local:6333
  VectorDb__Url: http://warptalk-qdrant.warptalk-data.svc.cluster.local:6333
  # kube-prometheus-stack is installed into the `monitoring` namespace (install-k3s-addons.sh).
  Monitoring__PrometheusUrl: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  # Firing alerts on the admin System Health page come from Alertmanager, the only place silences
  # and inhibitions exist (Prometheus rule state lists silenced alerts as firing).
  Monitoring__AlertmanagerUrl: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
  # Same-origin path the admin-only Grafana is published under (monitoring-values.yaml grafana.ingress,
  # behind the gateway ForwardAuth). The System Health page embeds its dashboards from here.
  Monitoring__GrafanaEmbedPath: /grafana
  VECTOR_DB_PROVIDER: qdrant
  EMBEDDING_PROVIDER: openai
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_DIMENSIONS: "1536"
  OPENAI_CHAT_TRANSLATION_MODEL: gpt-4o-mini
  OpenAI__ChatTranslationModel: gpt-4o-mini
  # Paired with STT_STREAMING_ENABLED — see deploy/production/app.compose.yml. The streaming
  # model is 2.9x SLOWER on a closed chunk, so these two revert together or not at all.
  STT_MODEL: gpt-live-transcribe
  STT_STREAMING_ENABLED: "true"
  # Both off the mini tier — see app.compose.yml for the measurements. Short version:
  # the mini models receive the ASR-repair hint and ignore it (0/3), the full ones act
  # on it (3/3), and the full realtime model is not measurably slower on ordinary speech.
  TRANSLATION_MODEL: gpt-4.1
  # Pinned explicitly — previously unset here and in app.compose.yml, so the primary
  # translation model came from shared/config.py's default with nothing in either
  # deploy file recording it. Keep both files in step.
  TRANSLATION_REALTIME_MODEL: gpt-realtime-2.1
  TTS_MODEL: sonic-3.5
  # See app.compose.yml for the reasoning: Luna replaces gpt-4.1 (cheaper + stronger,
  # off the realtime path); the chat model stays on 4o-mini because Luna is dearer
  # and slower than a mini model.
  ASSISTANT_MODEL: gpt-5.6-luna
  # Requires the /v1/responses agent loop — see app.compose.yml. On chat completions a
  # reasoning model rejects function tools outright.
  ASSISTANT_CHAT_MODEL: gpt-5.6-luna
  SUGGESTION_ENABLED: "true"
  # Kept in step with deploy/production/app.compose.yml — see the sensitivity block there for
  # why each of these overrides the code default.
  SUGGESTION_COOLDOWN_SECONDS: "20"
  SUGGESTION_MAX_PER_MEETING: "30"
  SUGGESTION_MIN_CONFIDENCE: "0.55"
  SUGGESTION_MIN_WORDS: "4"
  SUGGESTION_MIN_STT_CONFIDENCE: "-0.5"
  SUGGESTION_DECIDE_MODEL: gpt-4o-mini
  SUGGESTION_GENERATE_MODEL: gpt-5.6-luna
  TTS_CACHE_ENABLED: "true"
  TTS_CACHE_TTL_SECONDS: "3600"
  BILLING_DB_MIN_POOL_SIZE: "1"
  BILLING_DB_MAX_POOL_SIZE: "5"
  BillingRates__SttPerMinute: "15"
  BillingRates__TranslationPerMinute: "15"
  BillingRates__StandardTtsPerMinute: "15"
  BillingRates__VoiceClonePerMinute: "40"
  BillingRates__AiSummaryPerRequest: "5"
  BillingRates__AiChatPerRequest: "2"
  # The compose defaults. They were raised 4-7x (login 5 -> 20) because every client arrived as
  # one address; the gateway now sees the real client IP (externalTrafficPolicy: Local on the
  # Traefik Service plus ForwardedHeaders__KnownNetworks for the pod CIDR), so a per-IP budget
  # means per client again.
  RateLimits__IpPermitLimit: "300"
  RateLimits__UserPermitLimit: "180"
  RateLimits__WorkspacePermitLimit: "1000"
  RateLimits__LoginPermitLimit: "5"
  RateLimits__InboxPermitLimit: "30"
  # WT-405 — see docker-compose.yml. Signing out and refreshing get their own per-address
  # budget so ordinary traffic cannot refuse them.
  RateLimits__SessionRecoveryPermitLimit: "60"
  RateLimits__WindowSeconds: "60"
  PGHOST: warptalk-postgres-rw.warptalk-data.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: postgres
  API_GATEWAY_URL: http://gateway:5200
  ASSISTANT_CHAT_WORKSPACE_SERVICE_URL: http://workspace-service:5106
  ASSISTANT_CHAT_TRANSCRIPT_SERVICE_URL: http://transcript-service:5103
  ASSISTANT_CHAT_TRANSLATION_ROOM_SERVICE_URL: http://translation-room-service:5102
  # WT-688: the MCP tool endpoint WarpBot calls to run a workspace's plugin tools.
  # Same in-cluster address the gateway routes the assistant cluster at.
  ASSISTANT_CHAT_ASSISTANT_SERVICE_URL: http://assistant-service:5108
  # get_platform_analytics only, and always with the caller's own bearer token — the
  # platform admin policy is enforced server-side on every path behind these.
  ASSISTANT_CHAT_BILLING_SERVICE_URL: http://billing-service:5107
  ASSISTANT_CHAT_AUTH_SERVICE_URL: http://auth-service:5101
  GrpcSettings__AuthServiceUrl: http://auth-service:50051
  GrpcSettings__BillingServiceUrl: http://billing-service:50057
  GrpcSettings__WorkspaceServiceUrl: http://workspace-service:50056
  GrpcSettings__TranslationRoomServiceUrl: http://translation-room-service:50052
  GrpcSettings__TranscriptServiceUrl: http://transcript-service:50053
  GrpcSettings__NotificationServiceUrl: http://notification-service:50054
  GrpcUrls__AuthServiceUrl: http://auth-service:50051
  GrpcUrls__WorkspaceServiceUrl: http://workspace-service:50056
  GrpcUrls__TranslationRoomServiceUrl: http://translation-room-service:50052
  GrpcUrls__TranscriptServiceUrl: http://transcript-service:50053
  GrpcUrls__NotificationServiceUrl: http://notification-service:50054
  GrpcUrls__BillingServiceUrl: http://billing-service:50057
  GrpcUrls__TranslationRoomService: http://translation-room-service:50052
  GrpcUrls__BillingService: http://billing-service:50057
  ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: http://auth-service:5101
  ReverseProxy__Clusters__translation-room-cluster__Destinations__translation-room-service__Address: http://translation-room-service:5102
  ReverseProxy__Clusters__transcript-cluster__Destinations__transcript-service__Address: http://transcript-service:5103
  ReverseProxy__Clusters__notification-cluster__Destinations__notification-service__Address: http://notification-service:5104
  ReverseProxy__Clusters__meeting-cluster__Destinations__meeting-service__Address: http://meeting-service:5105
  ReverseProxy__Clusters__workspace-cluster__Destinations__workspace-service__Address: http://workspace-service:5106
  ReverseProxy__Clusters__billing-cluster__Destinations__billing-service__Address: http://billing-service:5107
  ReverseProxy__Clusters__assistant-cluster__Destinations__assistant-service__Address: http://assistant-service:5108

workloads:
  frontend:
    image: frontend
    writableCachePath: /app/.next/cache
    replicas: 2
    port: 3000
    healthPath: /
    cpu: 200m
    memory: 256Mi
    cpuLimit: "1"
    memoryLimit: 1Gi
    autoscaling: {enabled: true, min: 2, max: 6, cpu: 70}
  gateway:
    image: gateway
    replicas: 2
    port: 5200
    healthPath: /health/ready
    cpu: 200m
    memory: 256Mi
    cpuLimit: "1"
    memoryLimit: 768Mi
    autoscaling: {enabled: true, min: 2, max: 8, cpu: 70}
    # The SignalR hubs terminate here: negotiate and the WebSocket upgrade must reach the same pod.
    stickySession:
      cookieName: warptalk_gateway_affinity
    secretEnv:
      Jwt__Secret: JWT_SECRET
      Jwt__PreviousSecrets: JWT_PREVIOUS_SECRETS
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
      SignalR__Redis: Redis__ConnectionString
  auth-service:
    image: auth-service
    replicas: 2
    port: 5101
    grpcPort: 50051
    healthPath: /health/ready
    cpu: 150m
    memory: 192Mi
    cpuLimit: "1"
    memoryLimit: 768Mi
    autoscaling: {enabled: true, min: 2, max: 5, cpu: 70}
    secretEnv:
      ConnectionStrings__AuthDb: AUTH_CONNECTION_STRING
      # Google sign-in. Production compose sets it (Authentication__Google__ClientId from
      # GOOGLE_CLIENT_ID, the id the web bundle is built with); the chart never did, so every
      # Google sign-in on the cluster would have failed with "Invalid Google token".
      Authentication__Google__ClientId: GOOGLE_CLIENT_ID
      Jwt__Secret: JWT_SECRET
      Jwt__PreviousSecrets: JWT_PREVIOUS_SECRETS
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
      Resend__ApiKey: RESEND_API_KEY
      Resend__FromEmail: RESEND_FROM_EMAIL
      Resend__FromName: RESEND_FROM_NAME
      Storage__Provider: STORAGE_PROVIDER
      Storage__S3__ServiceUrl: STORAGE_S3_SERVICE_URL
      Storage__S3__AccessKey: STORAGE_S3_ACCESS_KEY
      Storage__S3__SecretKey: STORAGE_S3_SECRET_KEY
      Storage__S3__BucketName: VOICE_SAMPLES_STORAGE_S3_BUCKET_NAME
  translation-room-service:
    image: translation-room-service
    # Hosted background loops that must not run concurrently on two replicas. Rendered as the
    # warptalk.io/singleton-workers annotation only; the guard itself is the backend's Redis
    # lock (fix/multi-replica-safety). Until that ships these loops run on every replica.
    singletonWorkers: [AbandonedRoomSweepWorker, IdleRoomMonitoringWorker, ReminderNotificationWorker, RecurringSeriesMaterializationWorker, ArtifactsReconciliationWorker, ArtifactsRecoveryWorker]
    replicas: 2
    port: 5102
    grpcPort: 50052
    healthPath: /health/ready
    cpu: 150m
    memory: 192Mi
    cpuLimit: "1"
    memoryLimit: 768Mi
    autoscaling: {enabled: true, min: 2, max: 6, cpu: 70}
    secretEnv:
      ConnectionStrings__TranslationRoomDb: TRANSLATION_ROOM_CONNECTION_STRING
      Jwt__Secret: JWT_SECRET
      Jwt__PreviousSecrets: JWT_PREVIOUS_SECRETS
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
      LiveKit__Egress__S3__AccessKey: LIVEKIT_EGRESS_S3_ACCESS_KEY
      LiveKit__Egress__S3__Secret: LIVEKIT_EGRESS_S3_SECRET
      LiveKit__Egress__S3__Bucket: LIVEKIT_EGRESS_S3_BUCKET
      LiveKit__Egress__S3__Region: LIVEKIT_EGRESS_S3_REGION
      LiveKit__Egress__S3__Endpoint: LIVEKIT_EGRESS_S3_ENDPOINT
      Smtp__Host: SMTP_HOST
      Smtp__Port: SMTP_PORT
      Smtp__Username: SMTP_USERNAME
      Smtp__Password: SMTP_PASSWORD
      Smtp__FromEmail: SMTP_FROM_EMAIL
      Smtp__FromName: SMTP_FROM_NAME
    # On the workload rather than in the shared ConfigMap, for the same reason the assistant
    # plugin keys are: this is the only service that reads it. The backend treats an absent
    # Gotenberg:Url as a supported state — the minutes export still serves .docx and reports PDF
    # as unavailable — so an unset value fails no probe, stops no rollout and writes no log line.
    # It simply answers 503 to every PDF download for the life of the release, which is what this
    # chart did from the day the feature shipped. See templates/gotenberg.yaml for the converter.
    env:
      Gotenberg__Url: http://gotenberg:3000
  transcript-service:
    image: transcript-service
    replicas: 2
    port: 5103
    grpcPort: 50053
    healthPath: /health/ready
    cpu: 200m
    memory: 256Mi
    cpuLimit: "1"
    memoryLimit: 1Gi
    autoscaling: {enabled: true, min: 2, max: 8, cpu: 70}
    secretEnv:
      ConnectionStrings__TranscriptDb: TRANSCRIPT_CONNECTION_STRING
      Jwt__Secret: JWT_SECRET
      Jwt__PreviousSecrets: JWT_PREVIOUS_SECRETS
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
  notification-service:
    image: notification-service
    replicas: 2
    port: 5104
    grpcPort: 50054
    healthPath: /health/ready
    cpu: 100m
    memory: 192Mi
    cpuLimit: 750m
    memoryLimit: 512Mi
    autoscaling: {enabled: true, min: 2, max: 5, cpu: 70}
    rabbitmq: true
    secretEnv:
      ConnectionStrings__DefaultConnection: NOTIFICATION_CONNECTION_STRING
      Jwt__Secret: JWT_SECRET
      Jwt__PreviousSecrets: JWT_PREVIOUS_SECRETS
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
      Resend__ApiKey: RESEND_API_KEY
      Resend__FromEmail: RESEND_FROM_EMAIL
      Resend__FromName: RESEND_FROM_NAME
      RESEND_API_KEY: RESEND_API_KEY
  meeting-service:
    image: meeting-service
    # Hosted background loops that must not run concurrently on two replicas. Rendered as the
    # warptalk.io/singleton-workers annotation only; the guard itself is the backend's Redis
    # lock (fix/multi-replica-safety). Until that ships these loops run on every replica.
    singletonWorkers: [EgressReconciliationWorker, HostFallbackConsumerWorker]
    replicas: 2
    port: 5105
    grpcPort: 50055
    healthPath: /health/ready
    cpu: 150m
    memory: 192Mi
    cpuLimit: "1"
    memoryLimit: 768Mi
    autoscaling: {enabled: true, min: 2, max: 6, cpu: 70}
    secretEnv:
      ConnectionStrings__DefaultConnection: MEETING_CONNECTION_STRING
      Jwt__Secret: JWT_SECRET
      Jwt__PreviousSecrets: JWT_PREVIOUS_SECRETS
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
      # MeetingChatHub (/api/v1/meetings/chat-hub) is hosted HERE, not in the gateway, and this
      # service runs 2+ replicas: without a backplane a message sent to one pod never reaches the
      # clients connected to the other. Same key the gateway reads (Program.cs "SignalR:Redis").
      SignalR__Redis: Redis__ConnectionString
      LiveKit__Url: LIVEKIT_URL
      LiveKit__ApiKey: LIVEKIT_API_KEY
      LiveKit__ApiSecret: LIVEKIT_API_SECRET
      LiveKit__Egress__S3__AccessKey: LIVEKIT_EGRESS_S3_ACCESS_KEY
      LiveKit__Egress__S3__Secret: LIVEKIT_EGRESS_S3_SECRET
      LiveKit__Egress__S3__Bucket: LIVEKIT_EGRESS_S3_BUCKET
      LiveKit__Egress__S3__Region: LIVEKIT_EGRESS_S3_REGION
      LiveKit__Egress__S3__Endpoint: LIVEKIT_EGRESS_S3_ENDPOINT
      Smtp__Host: SMTP_HOST
      Smtp__Port: SMTP_PORT
      Smtp__Username: SMTP_USERNAME
      Smtp__Password: SMTP_PASSWORD
      Smtp__FromEmail: SMTP_FROM_EMAIL
      Smtp__FromName: SMTP_FROM_NAME
      OpenAI__ApiKey: OPENAI_API_KEY
      Storage__Provider: STORAGE_PROVIDER
      Storage__S3__ServiceUrl: STORAGE_S3_SERVICE_URL
      Storage__S3__AccessKey: STORAGE_S3_ACCESS_KEY
      Storage__S3__SecretKey: STORAGE_S3_SECRET_KEY
      Storage__S3__BucketName: MEETING_CHAT_STORAGE_S3_BUCKET_NAME
  workspace-service:
    image: workspace-service
    replicas: 2
    port: 5106
    grpcPort: 50056
    healthPath: /health/ready
    cpu: 150m
    memory: 256Mi
    cpuLimit: "1"
    memoryLimit: 1Gi
    autoscaling: {enabled: true, min: 2, max: 6, cpu: 70}
    rabbitmq: true
    secretEnv:
      ConnectionStrings__WorkspaceDb: WORKSPACE_CONNECTION_STRING
      Jwt__Secret: JWT_SECRET
      Jwt__PreviousSecrets: JWT_PREVIOUS_SECRETS
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
      Resend__ApiKey: RESEND_API_KEY
      Resend__FromEmail: RESEND_FROM_EMAIL
      Resend__FromName: RESEND_FROM_NAME
      Storage__Provider: STORAGE_PROVIDER
      Storage__MasterKey: WORKSPACE_STORAGE_MASTER_KEY
      Storage__S3__ServiceUrl: STORAGE_S3_SERVICE_URL
      Storage__S3__AccessKey: STORAGE_S3_ACCESS_KEY
      Storage__S3__SecretKey: STORAGE_S3_SECRET_KEY
      Storage__S3__BucketName: STORAGE_S3_BUCKET_NAME
      VectorDb__ApiKey: VECTOR_DB_API_KEY
  billing-service:
    image: billing-service
    # Hosted background loops that must not run concurrently on two replicas. Rendered as the
    # warptalk.io/singleton-workers annotation only; the guard itself is the backend's Redis
    # lock (fix/multi-replica-safety). Until that ships these loops run on every replica.
    singletonWorkers: [SubscriptionExpirationWorker, SessionMonitorWorker, BillingCycleWorker, InvoiceOverdueSweeper, DailyAuditAggregationWorker, BillingAggregationWorker, BillingOutboxWorker, EntitlementReconcileWorker]
    replicas: 2
    port: 5107
    grpcPort: 50057
    healthPath: /health/ready
    cpu: 150m
    memory: 192Mi
    cpuLimit: "1"
    memoryLimit: 768Mi
    autoscaling: {enabled: true, min: 2, max: 5, cpu: 70}
    rabbitmq: true
    secretEnv:
      ConnectionStrings__BillingDb: BILLING_CONNECTION_STRING
      ConnectionStrings__Redis: ConnectionStrings__Redis
      Jwt__Secret: JWT_SECRET
      Jwt__PreviousSecrets: JWT_PREVIOUS_SECRETS
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
      # BillingHub is hosted in this service as well as in the gateway; backplane as above.
      SignalR__Redis: Redis__ConnectionString
      Stripe__SecretKey: STRIPE_SECRET_KEY
      Stripe__WebhookSecret: STRIPE_WEBHOOK_SECRET
    # CartesiaUsageSyncWorker (admin Insights, measured dubbing cost). Optional: without the admin
    # key the worker logs once that it is disabled and Insights estimate. Several replicas are safe:
    # they share one sync schedule through a Redis lease, so Cartesia sees one sync per interval.
    optionalSecretEnv:
      Cartesia__AdminApiKey: CARTESIA_ADMIN_API_KEY
      Cartesia__UsageApiKeyId: CARTESIA_USAGE_API_KEY_ID
    # Admin Providers page: public status pages polled for the 90-day uptime row (statuspage.io v2
    # API, verified 2026-09-25; Stripe's page has none). Public URLs, not secrets. Remove a line to
    # stop polling that provider; ProviderStatus__PollIntervalMinutes: "0" stops all of them.
    env:
      ProviderStatus__Pages__openai: https://status.openai.com
      ProviderStatus__Pages__cartesia: https://status.cartesia.ai
      ProviderStatus__Pages__livekit: https://status.livekit.io
  assistant-service:
    image: assistant-service
    replicas: 2
    port: 5108
    healthPath: /health/ready
    cpu: 150m
    memory: 192Mi
    cpuLimit: "1"
    memoryLimit: 768Mi
    autoscaling: {enabled: true, min: 2, max: 5, cpu: 70}
    # The plugin surface (WT-565/WT-602). These sit on the workload rather than in the shared
    # ConfigMap because this is the only service that reads them, and a key ring path means
    # nothing to a pod without the claim below. Values go through `tpl`, so global.domain stays
    # the one place the host is written down: this chart serves a single host with /api and
    # /oauth routed to the gateway, where production compose splits APP_DOMAIN from API_DOMAIN.
    env:
      # Host by host as in deploy/production/app.compose.yml: the three URLs compose builds from
      # ${API_DOMAIN} use the API host, ClientUri the app host. These are registered with Google
      # and with every MCP provider a workspace has connected, so a cutover that changed one of
      # them would break OAuth for everyone; scripts/check-k3s-compose-url-parity.sh fails the
      # build when any of them drifts from compose.
      Plugins__Mcp__Client__RedirectUri: https://{{ include "warptalk.apiHost" . }}/api/v1/assistant/plugins/mcp/oauth/callback
      Plugins__Mcp__Client__ClientMetadataUrl: https://{{ include "warptalk.apiHost" . }}/oauth/client-metadata/v1.json
      Plugins__Mcp__Client__JwksUrl: https://{{ include "warptalk.apiHost" . }}/oauth/client-metadata/jwks.json
      Plugins__Mcp__Client__ClientUri: https://{{ .Values.global.domain }}
      # Kept in step with deploy/production/app.compose.yml: one redirect URI for the whole
      # provider, with the plugin key in the protected state. Google matches it exactly on both
      # the authorization request and the token exchange, so Cloud Console has to carry this
      # exact string - a deployment whose console entry names the old per-plugin path cannot
      # connect any Google plugin at all.
      Plugins__GoogleWorkspace__OAuth__RedirectUri: https://{{ include "warptalk.apiHost" . }}/api/v1/assistant/plugins/oauth/google/callback
      # The retired per-plugin URI, which only finishes consents that were already authorized
      # against it when the deploy landed. Both URIs have to be registered in Cloud Console while
      # this is set; an authorization code lives minutes, so once a deploy has settled, delete
      # this line, the legacy route and the console entry together.
      Plugins__GoogleWorkspace__OAuth__LegacyRedirectUri: https://{{ include "warptalk.apiHost" . }}/api/v1/assistant/plugins/google_workspace/oauth/callback
      # Every plugin secret and user token in assistant.plugins / plugin_connections is encrypted
      # with this ring. Program.cs takes the path silently when it is absent and keeps the keys in
      # memory, so an unset value here is not an error anywhere - it is a rollout that orphans
      # every token written before it.
      DataProtection__KeyRingPath: /var/lib/warptalk/keys
    persistence:
      name: keyring
      mountPath: /var/lib/warptalk/keys
      size: 1Gi
      # Both replicas read one ring, so this has to be RWX. pvcs.yaml refuses the combination
      # that would hand each pod its own keys instead.
      accessMode: ReadWriteMany
      storageClass: ""
    secretEnv:
      ConnectionStrings__AssistantDb: ASSISTANT_CONNECTION_STRING
      Jwt__SecretKey: JWT_SECRET
      Grpc__InternalSecret: GRPC_INTERNAL_SECRET
      Redis__ConnectionString: Redis__ConnectionString
      # AssistantHub (/api/v1/assistant/chat-hub) is hosted here; backplane as above.
      SignalR__Redis: Redis__ConnectionString
      # A secretKeyRef to a key the runtime secret does not carry leaves the pod in
      # CreateContainerConfigError, which is the loud half of the lesson from the release where
      # an unset client id started cleanly and died on Google's consent screen instead.
      Plugins__GoogleWorkspace__OAuth__ClientId: GOOGLE_WORKSPACE_CLIENT_ID
      Plugins__GoogleWorkspace__OAuth__ClientSecret: GOOGLE_WORKSPACE_CLIENT_SECRET
  stt-worker:
    image: ai-stt
    workerHealthName: stt
    replicas: 2
    cpu: 500m
    memory: 512Mi
    cpuLimit: "2"
    memoryLimit: 2Gi
    autoscaling: {enabled: false}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD
      OPENAI_API_KEY: OPENAI_API_KEY
      STT_PROVIDER: STT_PROVIDER
      STT_API_KEY: STT_API_KEY
  translation-worker:
    image: ai-translation
    workerHealthName: translation
    replicas: 2
    cpu: 300m
    memory: 384Mi
    cpuLimit: "2"
    memoryLimit: 1Gi
    autoscaling: {enabled: false}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD
      OPENAI_API_KEY: OPENAI_API_KEY
      TRANSLATION_PROVIDER: TRANSLATION_PROVIDER
      TRANSLATION_API_KEY: TRANSLATION_API_KEY
  tts-worker:
    image: ai-tts
    workerHealthName: tts
    replicas: 2
    cpu: 300m
    memory: 384Mi
    cpuLimit: "2"
    memoryLimit: 1Gi
    autoscaling: {enabled: false}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD
      OPENAI_API_KEY: OPENAI_API_KEY
      TTS_PROVIDER: TTS_PROVIDER
      TTS_API_KEY: TTS_API_KEY
      # Same omission as deploy/production/app.compose.yml: the TTS worker
      # publishes into the LiveKit room and needs these three.
      LIVEKIT_URL: LIVEKIT_URL
      LIVEKIT_API_KEY: LIVEKIT_API_KEY
      LIVEKIT_API_SECRET: LIVEKIT_API_SECRET
  assistant-worker:
    image: ai-assistant
    workerHealthName: assistant,assistant-chat
    replicas: 2
    cpu: 200m
    memory: 384Mi
    cpuLimit: "1"
    memoryLimit: 1Gi
    autoscaling: {enabled: true, min: 2, max: 8, cpu: 70}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD
      OPENAI_API_KEY: OPENAI_API_KEY
      VECTOR_DB_API_KEY: VECTOR_DB_API_KEY
  suggestion-worker:
    image: ai-suggestion
    workerHealthName: suggestion
    # Pinned to a single replica, and no autoscaling, unlike its neighbours. The cooldown
    # and per-meeting budget are enforced in Redis so they would survive a fan-out, but the
    # rolling transcript window the decide stage reasons over is per-process: with N
    # replicas the consumer group splits one room's segments N ways and each replica sees a
    # fraction of the conversation, which degrades the decision quality this feature exists
    # for. It is also not on the latency path — nothing waits on a suggestion.
    replicas: 1
    singleton: true
    cpu: 100m
    memory: 256Mi
    cpuLimit: "500m"
    memoryLimit: 512Mi
    autoscaling: {enabled: false}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD
      OPENAI_API_KEY: OPENAI_API_KEY

  embedding-worker:
