    memory: 192Mi
    cpuLimit: 500m
    memoryLimit: 512Mi
    autoscaling: {enabled: false}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD
      OPENAI_API_KEY: OPENAI_API_KEY
      BILLING_DB_DSN: BILLING_DB_DSN
  livekit-ingress-worker:
    image: ai-livekit-ingress
    workerHealthName: livekit_ingress
    writableCachePath: /app/.cache
    replicas: 2
    cpu: 500m
    memory: 768Mi
    cpuLimit: "2"
    memoryLimit: 3Gi
    autoscaling: {enabled: true, min: 2, max: 8, cpu: 70}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD
      OPENAI_API_KEY: OPENAI_API_KEY
      LIVEKIT_URL: LIVEKIT_URL
      LIVEKIT_API_KEY: LIVEKIT_API_KEY
      LIVEKIT_API_SECRET: LIVEKIT_API_SECRET
  security-worker:
    image: ai-security
    workerHealthName: security
    replicas: 2
    cpu: 100m
    memory: 192Mi
    cpuLimit: 500m
    memoryLimit: 512Mi
    autoscaling: {enabled: false}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD
      OPENAI_API_KEY: OPENAI_API_KEY
  metrics-exporter:
    image: ai-metrics
    # One scraper is enough: a second publishes every stream series twice and doubles the
    # XINFO load on Redis for nothing.
    replicas: 1
    singleton: true
    port: 9108
    healthPath: /health/ready
    cpu: 100m
    memory: 128Mi
    cpuLimit: 500m
    memoryLimit: 512Mi
    autoscaling: {enabled: false}
    secretEnv:
      REDIS_PASSWORD: REDIS_PASSWORD

# Exec probes of the Python workers (every workload with workerHealthName). Each run starts a new
# interpreter and imports the Redis client before it reads the heartbeat; on a CPU-pressed node
# that took longer than the old 5s timeout, and the kubelet killed healthy workers into
# CrashLoopBackOff. 15s is a realistic ceiling; startup allows 15s x 12 = 3 min; liveness needs
# 3 misses 30s apart (~1.5 min) before a restart. scripts/check-k3s-deployment.sh pins the floors.
workerProbe:
  timeoutSeconds: 15
  startup:
    periodSeconds: 15
    failureThreshold: 12
  liveness:
    periodSeconds: 30
    failureThreshold: 3

# DOCX -> PDF for the exported biên bản. A third-party image, so it is pinned by digest and
# locked in deploy/k3s/addons.lock.env like the collector and the SQL exporter, rather than
# living in .Values.workloads — nothing in a WarpTalk release rewrites this tag.
gotenberg:
  replicas: 2
  image: gotenberg/gotenberg:8.21.1@sha256:91486863744f7420ca985ee6cef7c216910e40faffd378f3da7c0fad724d01ba
  resources:
    # The CPU limit is load-bearing, not a guess. Gotenberg starts LibreOffice lazily and
    # restarts it after every 10 conversions, so a cold start recurs in ordinary use; measured
    # against this digest with one document in flight, that start took 59s at 0.5 CPU and 17s at
    # 1 CPU, against a stock 20s start timeout that answers 503 the moment it is missed. Memory
    # is the opposite: the same run peaked at 132Mi, so 512Mi is headroom, not a measurement.
    requests: {cpu: 200m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

ingress:
  enabled: true
  className: traefik
  # Optional bare domain served like the app host (frontend). Its own Certificate, so an apex
  # whose DNS does not point at the cluster cannot hold the app/api certificate hostage.
  apexDomain: ""
  apexTlsSecretName: warptalk-apex-tls
  tlsSecretName: warptalk-tls
  # TLS secret for global.apiDomain; empty means it shares tlsSecretName.
  apiTlsSecretName: ""
  certManager:
    enabled: false
    clusterIssuerName: warptalk-letsencrypt
    email: ""
    server: https://acme-v02.api.letsencrypt.org/directory

networkPolicy:
  traefikNamespace: traefik

telemetry:
  replicas: 2
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
  # The memory limit is paired with memory_limiter in files/otel-collector.yaml (limit_mib 300):
  # keep the container limit ~20% above it, never below.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 200m, memory: 384Mi}

# Logs and traces (see templates/seq.yaml). Same image and digest as production compose.
seq:
  enabled: true
  image: datalust/seq:2026.1.17004-x64@sha256:6f9a27389bc8deff86319c9591b21c1216ee24ceb71315127e33c68f14b38bc9
  storageClass: ""
  storageSize: 10Gi
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 200m, memory: 640Mi}

costObservability:
  enabled: true
  image: burningalchemist/sql_exporter@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
  rates:
    sttUsdPerMinute: "0"
    translationUsdPerMinute: "0"
    ttsUsdPerMinute: "0"
    voiceCloneUsdPerMinute: "0"
    livekitUsdPerRoomMinute: "0"
  budgets:
    sttUsd: "0"
    translationUsd: "0"
    ttsUsd: "0"
    voiceCloneUsd: "0"
    livekitUsd: "0"
    objectStorageGb: "0"
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {cpu: 200m, memory: 128Mi}

keda:
  enabled: true
  redisSentinelAddresses: warptalk-redis.warptalk-data.svc.cluster.local:26379
  queueLagThreshold: "120"
  activationQueueLagThreshold: "1"
  workers:
    stt-worker:
      min: 2
      max: 12
      stream: audio:chunks
      consumerGroup: stt-workers
    translation-worker:
      min: 2
      max: 12
      stream: stt:results
      consumerGroup: translate-workers
    tts-worker:
      min: 2
      max: 12
      stream: translate:results
      consumerGroup: tts-workers

# Rolling-update shape. The default surges (new pod first, zero unavailable) for every workload,
# which is what makes a rollout invisible: the old pod keeps serving until its replacement is
# Ready. scripts/deploy-k3s-release.sh measures the App node before each release and, only when
# it cannot fit one more pod of the largest workload, overrides both to replace in place for that
# one release (and says so). Values files do not override these.
rollout:
  multiReplica:
    maxSurge: 1
    maxUnavailable: 0
  singleReplica:
    maxSurge: 1
    maxUnavailable: 0
  # Drain. On SIGTERM a pod is removed from the Service endpoints at the same moment the kubelet
  # signals it, and Traefik / kube-proxy learn about it a few seconds later; the preStop sleep keeps
  # the pod answering until they have. The grace period then covers the sleep plus the process's
  # own graceful shutdown (ASP.NET Core's HostOptions.ShutdownTimeout is 30s).
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 45
  # Kept below every probe window so a Ready pod has proven itself before the next one is replaced.
  minReadySeconds: 5
