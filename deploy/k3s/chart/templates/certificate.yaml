{{- if .Values.ingress.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.certManager.clusterIssuerName }}
spec:
  acme:
    email: {{ required "ingress.certManager.email is required" .Values.ingress.certManager.email | quote }}
    server: {{ .Values.ingress.certManager.server }}
    privateKeySecretRef:
      name: {{ .Values.ingress.certManager.clusterIssuerName }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingress.className }}
---
# The app and API hosts. cert-manager renews 30 days before expiry, so nobody owns a manual
# renewal; the release acceptance gate waits for this Certificate to be Ready.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tlsSecretName }}
spec:
  secretName: {{ .Values.ingress.tlsSecretName }}
  dnsNames:
    - {{ .Values.global.domain }}
    {{- if and .Values.global.apiDomain (not .Values.ingress.apiTlsSecretName) }}
    - {{ .Values.global.apiDomain }}
    {{- end }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.ingress.certManager.clusterIssuerName }}
{{- if and .Values.global.apiDomain .Values.ingress.apiTlsSecretName }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.apiTlsSecretName }}
spec:
  secretName: {{ .Values.ingress.apiTlsSecretName }}
  dnsNames:
    - {{ .Values.global.apiDomain }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.ingress.certManager.clusterIssuerName }}
{{- end }}
{{- with .Values.ingress.apexDomain }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.ingress.apexTlsSecretName }}
spec:
  secretName: {{ $.Values.ingress.apexTlsSecretName }}
  dnsNames:
    - {{ . }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ $.Values.ingress.certManager.clusterIssuerName }}
{{- end }}
{{- end }}
