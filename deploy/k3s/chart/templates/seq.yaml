{{- if .Values.seq.enabled }}
{{- /*
The log and trace store, and the same one production compose runs (deploy/production/infra.compose.yml,
observability/otel-collector.yml): the collector ships OTLP logs and traces to Seq's /ingest/otlp.
The collector used to end both pipelines in the `debug` exporter, which prints a sample to the
collector's own stdout and keeps nothing - every trace and structured log in the cluster was
discarded on arrival.

A third-party image on a locked digest (deploy/k3s/addons.lock.env SEQ_IMAGE_DIGEST), like the
collector and Gotenberg. One replica on a ReadWriteOnce claim: Seq is a single-node store, so the
Deployment is Recreate - two pods on one data directory would corrupt it. Reach the UI with
`kubectl -n warptalk port-forward svc/seq 5341:80`; it is deliberately not on the Ingress.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seq-data
  labels:
    app.kubernetes.io/name: seq
    {{- include "warptalk.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.seq.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.seq.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  labels:
    app.kubernetes.io/name: seq
    {{- include "warptalk.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seq
        {{- include "warptalk.labels" . | nindent 8 }}
    spec:
      serviceAccountName: warptalk
      automountServiceAccountToken: false
      {{- include "warptalk.placement" . | nindent 6 }}
      # The image runs as root, as it does under compose; the capability set below is the
      # smallest one that still lets it bind :80 and own the files on a fresh volume.
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seq
          image: {{ .Values.seq.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCEPT_EULA
              value: "Y"
            # Same first-run credential as compose. Only read when /data is empty.
            - name: SEQ_FIRSTRUN_ADMINPASSWORDHASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: SEQ_ADMIN_PASSWORD_HASH
            # Seq sizes its caches from the machine, not the cgroup; cap it under the limit.
            - name: SEQ_CACHE_SYSTEMRAMTARGET
              value: "0.5"
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "DAC_OVERRIDE", "FOWNER"]
          resources:
            {{- toYaml .Values.seq.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seq-data
---
apiVersion: v1
kind: Service
metadata:
  name: seq
  labels:
    app.kubernetes.io/name: seq
    {{- include "warptalk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seq
  ports:
    - {name: http, port: 80, targetPort: http}
{{- end }}
