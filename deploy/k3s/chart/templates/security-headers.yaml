{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: warptalk-security-headers
  labels:
    {{- include "warptalk.labels" . | nindent 4 }}
spec:
  headers:
    contentTypeNosniff: true
    customFrameOptionsValue: DENY
    contentSecurityPolicy: >-
      default-src 'self'; base-uri 'self'; frame-ancestors 'none';
      frame-src https://accounts.google.com/gsi/;
      object-src 'none'; form-action 'self';
      img-src 'self' data: blob: https:;
      media-src 'self' blob: https:;
      connect-src 'self' https: wss: https://accounts.google.com/gsi/;
      script-src 'self' 'unsafe-inline' blob: https://accounts.google.com/gsi/client;
      style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com;
      font-src 'self' data: https:;
      worker-src 'self' blob:
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    permissionsPolicy: >-
      camera=(self), microphone=(self), geolocation=(), payment=(self),
      usb=(), browsing-topics=()
{{- end }}
