{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warptalk
  labels:
    {{- include "warptalk.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-warptalk-security-headers@kubernetescrd
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "warptalk_gw_stick"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "none"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.global.domain | quote }}
        - "warptalk.io.vn"
      secretName: {{ .Values.ingress.tlsSecretName }}
    - hosts:
        - "api.warptalk.io.vn"
      secretName: warptalk-api-tls
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          - path: /oauth/client-metadata
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 3000}
    - host: "warptalk.io.vn"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          - path: /oauth/client-metadata
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 3000}
    - host: "api.warptalk.io.vn"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
{{- end }}
