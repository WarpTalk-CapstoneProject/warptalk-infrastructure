{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warptalk
  labels:
    {{- include "warptalk.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: warptalk-security-headers@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.global.domain | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          # The Client ID Metadata Document and its JWKS. An MCP authorization server fetches
          # these by URL to learn who WarpTalk is, and the gateway forwards /oauth/client-metadata
          # to the assistant service; without this rule they resolve to the frontend and CIMD
          # registration falls back to DCR, or fails outright where DCR is not offered.
          - path: /oauth/client-metadata
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 5200}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 3000}
{{- end }}
