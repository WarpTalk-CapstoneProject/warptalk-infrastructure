apiVersion: batch/v1
kind: Job
metadata:
  name: warptalk-migrations-{{ .Release.Revision }}
  labels:
    {{- include "warptalk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warptalk-migrator
        {{- include "warptalk.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: warptalk
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrator
          {{- if .Values.global.production }}
          {{- $imageRef := required "migrator.imageRef is required in production" .Values.migrator.imageRef }}
          {{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $imageRef) }}
          {{- fail "migrator.imageRef must be an immutable @sha256 reference" }}
          {{- end }}
          image: {{ $imageRef | quote }}
          {{- else }}
          image: "{{ .Values.global.imageRegistry }}/migrator:{{ .Values.global.imageTag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef: {name: warptalk-runtime}
            - secretRef: {name: {{ .Values.secret.name }}}
          env:
            - name: RELEASE_ID
              value: {{ .Values.global.releaseId | quote }}
            - name: MIGRATION_APPLIED_BY
              value: k3s-release-gate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
