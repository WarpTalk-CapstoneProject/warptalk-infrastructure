{{- range $name, $app := .Values.workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "warptalk.labels" $ | nindent 4 }}
spec:
  {{- if not (or (and $app.autoscaling $app.autoscaling.enabled) (hasSuffix "-worker" $name)) }}
  replicas: {{ $app.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "warptalk.labels" $ | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: warptalk
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        {{- if $app.runAsUser }}
        runAsUser: {{ $app.runAsUser }}
        runAsGroup: {{ $app.runAsGroup | default $app.runAsUser }}
        {{- else if or (hasSuffix "-worker" $name) (eq $name "metrics-exporter") }}
        runAsUser: 999
        runAsGroup: 999
        {{- else if eq $name "frontend" }}
        runAsUser: 1000
        runAsGroup: 1000
        {{- else }}
        runAsUser: 1654
        runAsGroup: 1654
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
        {{- with $app.persistence }}
        # A freshly provisioned volume belongs to root, and kubelet only re-groups it when fsGroup
        # says so. The .NET images run as $APP_UID (1654) with a read-only root filesystem, so
        # without this the first write to the key ring throws and every plugin connect 500s -
        # after readiness has already passed, because nothing touches the ring at startup.
        fsGroup: {{ .fsGroup | default 1654 }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $name }}
      containers:
        - name: {{ $name }}
          {{- if $.Values.global.production }}
          {{- $imageRef := required (printf "workloads.%s.imageRef is required in production" $name) $app.imageRef }}
          {{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $imageRef) }}
          {{- fail (printf "workloads.%s.imageRef must be an immutable @sha256 reference" $name) }}
          {{- end }}
          image: {{ $imageRef | quote }}
          {{- else }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $app.image }}:{{ $.Values.global.imageTag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            {{- if or (hasSuffix "-exporter" $name) (eq $name "billing-cost-exporter") (eq $name "livekit-cost-exporter") (eq $name "workspace-storage-exporter") }}
            runAsUser: 65534
            runAsGroup: 65534
            {{- else if or (hasSuffix "-worker" $name) (eq $name "metrics-exporter") }}
            runAsUser: 999
            runAsGroup: 999
            {{- else if eq $name "frontend" }}
            runAsUser: 1000
            runAsGroup: 1000
            {{- else }}
            runAsUser: 1654
            runAsGroup: 1654
            {{- end }}
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          envFrom:
            - configMapRef:
                name: warptalk-runtime
          env:
          {{- with $app.port }}
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ . | quote }}
          {{- end }}
          {{- range $envName, $value := $app.env }}
            - name: {{ $envName }}
              value: {{ tpl (toString $value) $ | quote }}
          {{- end }}
          {{- range $envName, $secretKey := $app.secretEnv }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ $secretKey }}
          {{- end }}
          {{- if $app.rabbitmq }}
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: warptalk-rabbitmq-default-user
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: warptalk-rabbitmq-default-user
                  key: password
          {{- end }}
          {{- with $app.workerHealthName }}
            - name: WORKER_HEALTH_NAME
              value: {{ . | quote }}
          {{- end }}
          {{- with $app.workerHealthName }}
          startupProbe:
            exec:
              command: ["python", "-m", "shared.health_probe"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["python", "-m", "shared.health_probe"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          {{- with $app.port }}
          ports:
            - name: http
              containerPort: {{ . }}
            {{- with $app.grpcPort }}
            - name: grpc
              containerPort: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $app.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $app.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- end }}
          resources:
            requests:
              cpu: {{ $app.cpu }}
              memory: {{ $app.memory }}
            limits:
              cpu: {{ $app.cpuLimit }}
              memory: {{ $app.memoryLimit }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with $app.writableCachePath }}
            - name: application-cache
              mountPath: {{ . }}
            {{- end }}
            {{- with $app.persistence }}
            - name: {{ $name }}-{{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with $app.writableCachePath }}
        - name: application-cache
          emptyDir: {}
        {{- end }}
        {{- with $app.persistence }}
        - name: {{ $name }}-{{ .name }}
          persistentVolumeClaim:
            claimName: {{ $name }}-{{ .name }}
        {{- end }}
{{- end }}
