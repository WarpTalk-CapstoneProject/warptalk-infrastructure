{{- range $name, $app := .Values.workloads }}
{{- $kedaManaged := include "warptalk.kedaManaged" (dict "name" $name "root" $) }}
{{- $hpaManaged := and (not $app.singleton) $app.autoscaling $app.autoscaling.enabled }}
{{- $uid := include "warptalk.runAsUser" (dict "name" $name "app" $app) }}
{{- $gid := include "warptalk.runAsGroup" (dict "name" $name "app" $app) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "warptalk.labels" $ | nindent 4 }}
  {{- with $app.singletonWorkers }}
  annotations:
    # Background loops in this service that must run on ONE replica at a time. They are safe at
    # replicas > 1 only once the backend's distributed lock (warptalk-backend
    # fix/multi-replica-safety) guards them; see deploy/k3s/README.md "Singleton workers".
    warptalk.io/singleton-workers: {{ join "," . | quote }}
  {{- end }}
spec:
  {{- /*
  Rendered unless an autoscaler owns the count. It used to be skipped for every "*-worker" name,
  so a worker with neither an HPA nor a KEDA ScaledObject (security-worker, billing-worker,
  suggestion-worker, embedding-worker) fell back to the API default of one replica whatever
  the values said.
  */}}
  {{- if $app.singleton }}
  replicas: 1
  {{- else if not (or $kedaManaged $hpaManaged) }}
  replicas: {{ $app.replicas }}
  {{- end }}
  {{- if $app.singleton }}
  # A singleton must never overlap itself, and a surge rollout runs old and new side by side.
  strategy:
    type: Recreate
  {{- else }}
  {{- $multi := ge (int ($app.replicas | default 1)) 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A workload with two or more pods may replace one at a time in place (see
      # rollout.multiReplica in the values): on a single, full App node a surge pod has nowhere
      # to schedule, the rollout never progresses and Helm times out. One pod keeps serving.
      maxUnavailable: {{ if $multi }}{{ $.Values.rollout.multiReplica.maxUnavailable }}{{ else }}0{{ end }}
      maxSurge: {{ if $multi }}{{ $.Values.rollout.multiReplica.maxSurge }}{{ else }}1{{ end }}
  {{- end }}
  minReadySeconds: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "warptalk.labels" $ | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: warptalk
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $uid }}
        runAsGroup: {{ $gid }}
        seccompProfile:
          type: RuntimeDefault
        {{- with $app.persistence }}
        # A freshly provisioned volume belongs to root, and kubelet only re-groups it when fsGroup
        # says so. The .NET images run as $APP_UID (1654) with a read-only root filesystem, so
        # without this the first write to the key ring throws and every plugin connect 500s -
        # after readiness has already passed, because nothing touches the ring at startup.
        fsGroup: {{ .fsGroup | default 1654 }}
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      {{- include "warptalk.placement" $ | nindent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ $name }}
      containers:
        - name: {{ $name }}
          {{- if $.Values.global.production }}
          {{- $imageRef := required (printf "workloads.%s.imageRef is required in production" $name) $app.imageRef }}
          {{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $imageRef) }}
          {{- fail (printf "workloads.%s.imageRef must be an immutable @sha256 reference" $name) }}
          {{- end }}
          image: {{ $imageRef | quote }}
          {{- else }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $app.image }}:{{ $.Values.global.imageTag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ $uid }}
            runAsGroup: {{ $gid }}
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          envFrom:
            - configMapRef:
                name: warptalk-runtime
          env:
          {{- with $app.port }}
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ . | quote }}
          {{- end }}
          {{- range $envName, $value := $app.env }}
            - name: {{ $envName }}
              value: {{ tpl (toString $value) $ | quote }}
          {{- end }}
          {{- range $envName, $secretKey := $app.secretEnv }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ $secretKey }}
          {{- end }}
          {{- /* A key the runtime secret may not carry yet. `optional` keeps the pod starting without it
                 (a plain secretKeyRef to a missing key is CreateContainerConfigError); the service
                 itself must treat the empty value as "feature off". */}}
          {{- range $envName, $secretKey := $app.optionalSecretEnv }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ $secretKey }}
                  optional: true
          {{- end }}
          {{- if $app.rabbitmq }}
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: warptalk-rabbitmq-default-user
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: warptalk-rabbitmq-default-user
                  key: password
          {{- end }}
          {{- with $app.workerHealthName }}
            - name: WORKER_HEALTH_NAME
              value: {{ . | quote }}
          {{- end }}
          {{- with $app.workerHealthName }}
          startupProbe:
            exec:
              command: ["python", "-m", "shared.health_probe"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["python", "-m", "shared.health_probe"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          {{- with $app.port }}
          ports:
            - name: http
              containerPort: {{ . }}
            {{- with $app.grpcPort }}
            - name: grpc
              containerPort: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $app.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $app.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- end }}
          resources:
            requests:
              cpu: {{ $app.cpu }}
              memory: {{ $app.memory }}
            limits:
              cpu: {{ $app.cpuLimit }}
              memory: {{ $app.memoryLimit }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with $app.writableCachePath }}
            - name: application-cache
              mountPath: {{ . }}
            {{- end }}
            {{- with $app.persistence }}
            - name: {{ $name }}-{{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with $app.writableCachePath }}
        - name: application-cache
          emptyDir: {}
        {{- end }}
        {{- with $app.persistence }}
        - name: {{ $name }}-{{ .name }}
          persistentVolumeClaim:
            claimName: {{ $name }}-{{ .name }}
        {{- end }}
{{- end }}
