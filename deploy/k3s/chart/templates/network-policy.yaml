apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
{{- if .Values.ingress.certManager.enabled }}
# cert-manager's HTTP-01 solver pods are created in this namespace per challenge and carry none of
# the labels above, so default-deny-ingress silently blackholed Traefik's requests to them: every
# challenge timed out (2026-09-24, release v222 failed acceptance on certificate/warptalk-tls).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-http01-solver-from-traefik
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
      ports:
        - protocol: TCP
          port: 8089
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-warptalk-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: warptalk
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: warptalk
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefikNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  policyTypes: [Ingress]
---
# Gotenberg is the only workload in this namespace carrying a browser and a document converter,
# and translation-room-service is the only pod with any business calling it. Nothing routes to it
# from outside: it has no Ingress path, and traefik reaches it only through the rule above.
#
# READ THE UNION, NOT THE NAME. NetworkPolicies are additive, and allow-warptalk-internal already
# admits every pod in this namespace to every pod labelled part-of: warptalk, gotenberg included.
# So this rule records who the caller is meant to be; today it does not exclude anyone else.
# Making it exclusive means taking gotenberg out of that broad selector, which changes how this
# chart labels a workload — a deliberate decision, not a tidy-up, and not one to make in the
# change that is only trying to stop production answering 503 to every PDF.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gotenberg-from-translation-room
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gotenberg
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: translation-room-service
      ports:
        - protocol: TCP
          port: 3000
  policyTypes: [Ingress]
