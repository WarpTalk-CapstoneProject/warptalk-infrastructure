# Production Kubernetes application values for the three Vietnix VMs
# (terraform/vietnix: App 8 vCPU / 16 GiB, Data 2 vCPU / 8 GiB, Infra 2 vCPU / 4 GiB).
#
# NO image references, digests or release ids live here. The k8s release job
# (.github/workflows/release.yml, job production-k8s) passes every imageRef and global.releaseId
# from the signed release manifest the build job produced - see scripts/deploy-k3s-release.sh.
# A hard-coded digest in this file is exactly what the release gate exists to prevent: a deploy
# that looks current and runs last month's images.
#
# The capacity arithmetic behind every request below is in deploy/k3s/README.md
# ("Capacity plan"); change a number here and the table there together.

global:
  production: true
  # APP_DOMAIN and API_DOMAIN, as production compose has always split them. Every callback URL
  # compose builds from ${API_DOMAIN} is built from apiDomain here, so a cutover changes no URL
  # registered at Google, Stripe or an MCP provider (scripts/check-k3s-compose-url-parity.sh).
  domain: app.warptalk.io.vn
  apiDomain: api.warptalk.io.vn
  imageRegistry: ghcr.io/warptalk-capstoneproject
  # Written by the release job (scripts/materialize-k8s-runtime-secrets.sh) from GHCR_PULL_TOKEN.
  imagePullSecrets:
    - name: warptalk-ghcr

placement:
  # Every application pod on the App VM. The Data VM carries the NoSchedule taint
  # node.warptalk.io/role=data, and the Infra VM is the control plane; the release job labels
  # and taints the nodes from K8S_*_NODES before it deploys (scripts/label-k8s-nodes.sh).
  nodeSelector:
    node.warptalk.io/role: app

network:
  # The live Calico pool (default-ipv4-ippool, 192.168.0.0/16; nodes hold 192.168.0-2.0/24).
  # Must equal POD_CIDR in scripts/k8s-cluster-bootstrap.sh for a rebuilt cluster.
  podCidrs:
    - 192.168.0.0/16

secret:
  # Target: one source of truth, the GitHub `production` environment. The release job writes
  # warptalk-runtime from K8S_RUNTIME_ENV (scripts/materialize-k8s-runtime-secrets.sh) and keeps
  # this disabled. Until K8S_RUNTIME_ENV exists the job falls back to the ClusterSecretStore
  # production was bootstrapped with (a `fake` provider: the values sit in the store's own spec)
  # and turns this on with the names below.
  externalSecret:
    enabled: false
    secretStoreName: warptalk-production-secret-store
    remoteKey: warptalk/production/runtime
    postgresRemoteKey: warptalk/production/postgres-superuser
    redisRemoteKey: warptalk/production/redis
    qdrantRemoteKey: warptalk/production/qdrant

ingress:
  className: traefik
  # The two secrets production already serves (app host, API host). cert-manager takes them
  # over in place, so a certificate is never swapped for one that does not cover its host.
  tlsSecretName: warptalk-tls
  apiTlsSecretName: warptalk-api-tls
  # Served like the app host. Production compose never had a Caddy block for it, so it is left
  # off until its DNS points at the App VM; setting it adds a separate Certificate that cannot
  # hold the app/api certificate hostage.
  apexDomain: ""
  certManager:
    enabled: true
    clusterIssuerName: warptalk-letsencrypt
    email: admin@warptalk.io.vn
    server: https://acme-v02.api.letsencrypt.org/directory

costObservability:
  enabled: true
  # Each of the three exporters: p95 14Mi / 1m.
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  rates:
    sttUsdPerMinute: "0.006"
    translationUsdPerMinute: "0.02"
    ttsUsdPerMinute: "0.015"
    voiceCloneUsdPerMinute: "0.03"
    livekitUsdPerRoomMinute: "0.004"
  budgets:
    sttUsd: "500"
    translationUsd: "500"
    ttsUsd: "500"
    voiceCloneUsd: "300"
    livekitUsd: "300"
    objectStorageGb: "500"

gotenberg:
  # Internal (called by translation-room-service for the PDF export only), so one replica; its
  # rollout still surges, so the PDF export is not interrupted by a release.
  replicas: 1
  resources:
    # Right-sized 2026-09-24 from 4.8 days of Prometheus (p95 170Mi, max 171Mi working set):
    # the old 128Mi request was BELOW what it uses. The CPU limit stays at 1: see the
    # load-bearing note in chart/values.yaml.
    requests: {cpu: 100m, memory: 224Mi}
    limits: {cpu: "1", memory: 512Mi}

telemetry:
  replicas: 1
  resources:
    # p95 88Mi. The limit is paired with memory_limiter (limit_mib 300); keep it >= 1.2x that.
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 200m, memory: 384Mi}

seq:
  storageClass: local-path
  storageSize: 10Gi
  resources:
    # p95 132Mi, max 146Mi.
    requests: {cpu: 50m, memory: 176Mi}
    limits: {cpu: 200m, memory: 640Mi}

# KEDA owns stt/translation/tts. One replica each at rest, as compose runs them; queue lag
# scales them out to three.
keda:
  workers:
    stt-worker: {min: 1, max: 3}
    translation-worker: {min: 1, max: 3}
    tts-worker: {min: 1, max: 3}

# Database migrations run as their own gated step before `helm upgrade`
# (scripts/deploy-k3s-release.sh), never as a Helm hook inside it.
migrations:
  mode: external

# Requests are right-sized from evidence, not from compose. Source: Prometheus on the production
# cluster, 2026-09-24, `container_memory_working_set_bytes` and `rate(container_cpu_usage_seconds_total[5m])`
# over [7d] (the cluster is 4.8 days old, so that is its whole life, including the first releases).
# Rule: request ~= p95 x 1.3, rounded up to 16Mi / 10m, floors 128Mi / 50m (HPA-managed CPU >= 100m
# and high enough that p95 sits below the HPA target, or the HPA pins the workload at its max:
# assistant-worker and livekit-ingress-worker ran at 3/3 for days on a 150m/200m request).
# Limits keep their compose headroom (>= ~1.5x the request). The per-workload table (observed,
# old -> new) and the App-node arithmetic are in deploy/k3s/README.md "Capacity plan";
# scripts/check-k3s-deployment.sh pins the budget.
workloads:
  frontend:            # p95 121Mi / 25m
    replicas: 2
    cpu: 100m
    memory: 160Mi
    cpuLimit: 200m
    memoryLimit: 512Mi
    autoscaling: {enabled: true, min: 2, max: 3, cpu: 80}

  gateway:             # p95 148Mi / 60m
    replicas: 2
    cpu: 100m
    memory: 208Mi
    cpuLimit: 500m
    memoryLimit: 512Mi
    autoscaling: {enabled: true, min: 2, max: 4, cpu: 70}

  auth-service:        # p95 233Mi / 38m
    replicas: 2
    cpu: 100m
    memory: 304Mi
    cpuLimit: 200m
    memoryLimit: 512Mi
    autoscaling: {enabled: true, min: 2, max: 3, cpu: 80}

  translation-room-service:  # p95 215Mi / 44m
    replicas: 2
    cpu: 100m
    memory: 288Mi
    cpuLimit: 300m
    memoryLimit: 640Mi
    autoscaling: {enabled: true, min: 2, max: 3, cpu: 80}

  transcript-service:  # p95 182Mi / 42m
    replicas: 2
    cpu: 100m
    memory: 240Mi
    cpuLimit: 300m
    memoryLimit: 640Mi
    autoscaling: {enabled: true, min: 2, max: 3, cpu: 80}

  notification-service:  # p95 169Mi / 29m
    replicas: 2
    cpu: 100m
    memory: 224Mi
    cpuLimit: 200m
    memoryLimit: 384Mi
    autoscaling: {enabled: true, min: 2, max: 3, cpu: 80}

  meeting-service:     # p95 184Mi / 29m
    replicas: 2
    cpu: 100m
    memory: 240Mi
    cpuLimit: 400m
    memoryLimit: 768Mi
    autoscaling: {enabled: true, min: 2, max: 3, cpu: 80}

  workspace-service:   # p95 253Mi / 48m
    replicas: 2
    cpu: 100m
    memory: 336Mi
    cpuLimit: 300m
    memoryLimit: 640Mi
    autoscaling: {enabled: true, min: 2, max: 3, cpu: 80}

  billing-service:     # p95 223Mi / 48m
    replicas: 2
    cpu: 100m
    memory: 304Mi
    cpuLimit: 300m
    memoryLimit: 640Mi
    autoscaling: {enabled: true, min: 2, max: 3, cpu: 80}

  # Two replicas like every other user-facing service. The key ring is a node-local (local-path)
  # ReadWriteOnce volume: its node affinity puts both pods, and every surge pod, on the node that
  # holds it, and RWO is per node, so both mount the same ring (see templates/pvcs.yaml). The claim
  # itself is unchanged - a PVC spec is immutable.
  assistant-service:   # p95 193Mi / 31m
    replicas: 2
    cpu: 50m
    memory: 256Mi
    cpuLimit: 300m
    memoryLimit: 640Mi
    autoscaling: {enabled: false}
    persistence:
      storageClass: local-path
      accessMode: ReadWriteOnce
      nodeLocal: true

  stt-worker:          # p95 122Mi / 93m (max 160Mi)
    cpu: 130m
    memory: 160Mi
    cpuLimit: 600m
    memoryLimit: 1Gi

  translation-worker:  # p95 124Mi / 73m
    cpu: 100m
    memory: 176Mi
    cpuLimit: 300m
    memoryLimit: 768Mi

  # WT-716, new: no production history yet, so sized from its closest relative (suggestion-worker,
  # also a text-only singleton on stt:results that calls an LLM off the live path, p95 113Mi / 90m)
  # plus headroom for the fugashi/unidic-lite Japanese tokenizer the prepass loads. Re-measure after
  # a week and apply the same p95 x 1.3 rule as the rest.
  transcript-clean-worker:
    cpu: 50m
    memory: 192Mi
    cpuLimit: 300m
    memoryLimit: 512Mi

  tts-worker:          # p95 112Mi / 65m (max 157Mi)
    cpu: 90m
    memory: 160Mi
    cpuLimit: 500m
    memoryLimit: 1Gi

  suggestion-worker:   # p95 113Mi / 90m
    cpu: 120m
    memory: 160Mi
    cpuLimit: 200m
    memoryLimit: 512Mi

  embedding-worker:    # p95 116Mi / 93m (max 152Mi)
    replicas: 1
    cpu: 130m
    memory: 160Mi
    cpuLimit: 300m
    memoryLimit: 1Gi
    autoscaling: {enabled: false}

  security-worker:     # p95 112Mi / 86m
    replicas: 1
    cpu: 120m
    memory: 160Mi
    cpuLimit: 200m
    memoryLimit: 384Mi

  billing-worker:      # p95 90Mi / 91m
    replicas: 1
    cpu: 120m
    memory: 128Mi
    cpuLimit: 200m
    memoryLimit: 384Mi

  metrics-exporter:    # p95 58Mi / 10m
    cpu: 25m
    memory: 80Mi
    cpuLimit: 100m
    memoryLimit: 192Mi

  # The one workload that was UNDER-requested: p95 629Mi (max 649Mi) against a 512Mi request, and
  # p95 CPU 205m against a 200m request with a 75% HPA target, so it sat at 3/3 replicas. The
  # limit moves up with the request so a burst is not an OOM kill.
  livekit-ingress-worker:  # p95 629Mi / 205m
    replicas: 1
    cpu: 320m
    memory: 832Mi
    cpuLimit: 600m
    memoryLimit: 1536Mi
    autoscaling: {enabled: true, min: 1, max: 3, cpu: 75}

  assistant-worker:    # p95 115Mi / 119m (max 154Mi)
    replicas: 1
    cpu: 180m
    memory: 160Mi
    cpuLimit: 300m
    memoryLimit: 768Mi
    autoscaling: {enabled: true, min: 1, max: 3, cpu: 80}
