# Production Kubernetes Application Helm Values
# Tuned for WarpTalk 3-VM Cluster (App Node: 8 vCPU / 16 GB RAM)

global:
  production: true
  domain: app.warptalk.io.vn
  imageRegistry: ghcr.io/warptalk
  releaseId: prod-k8s-v1

secret:
  externalSecret:
    enabled: true
    secretStoreName: warptalk-production-secret-store
    remoteKey: warptalk/production/runtime
    postgresRemoteKey: warptalk/production/postgres-superuser
    redisRemoteKey: warptalk/production/redis
    qdrantRemoteKey: warptalk/production/qdrant

ingress:
  className: traefik
  tlsSecretName: warptalk-tls
  certManager:
    enabled: false
    clusterIssuerName: warptalk-letsencrypt
    email: admin@warptalk.io.vn

migrator:
  imageRef: ghcr.io/warptalk-capstoneproject/migrator:prod-k8s-v1@sha256:529497b3afe7216b9e9402c0b0ba8ac90406df5aaabe690b6c187a6996b02a91

costObservability:
  enabled: true
  rates:
    sttUsdPerMinute: "0.006"
    translationUsdPerMinute: "0.02"
    ttsUsdPerMinute: "0.015"
    voiceCloneUsdPerMinute: "0.03"
    livekitUsdPerRoomMinute: "0.004"
  budgets:
    sttUsd: "500"
    translationUsd: "500"
    ttsUsd: "500"
    voiceCloneUsd: "300"
    livekitUsd: "300"
    objectStorageGb: "500"

# Workloads tuned for 16GB App Node RAM budget
gotenberg:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 512Mi}

telemetry:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

workloads:
  frontend:
    replicas: 2
    cpu: 50m
    memory: 96Mi
    autoscaling: {enabled: true, min: 2, max: 4, cpu: 75}
    imageRef: ghcr.io/warptalk-capstoneproject/frontend:prod-k8s-v1@sha256:02c18fb336118fae151ca7bf09158b563a093f06a87adbf30213bf41d91d8325

  gateway:
