name: warptalk-infra

x-infra-service-defaults: &infra-service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 60s
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  redis:
    <<: *infra-service-defaults
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "${INFRA_PRIVATE_IP:?}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 896M
    networks: [infra-net]

  rabbitmq:
    <<: *infra-service-defaults
    image: rabbitmq:4.1-management-alpine@sha256:be17ed4ea63adcbbd75e7fda9afe16860626bd7b5f6153acc262025b67cbe451
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${INFRA_PRIVATE_IP:?}:5672:5672"
      - "${INFRA_PRIVATE_IP:?}:15672:15672"
      - "${INFRA_PRIVATE_IP:?}:15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 640M
    networks: [infra-net]

  otel-collector:
    <<: *infra-service-defaults
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ../../observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "${INFRA_PRIVATE_IP:?}:4317:4317"
      - "${INFRA_PRIVATE_IP:?}:4318:4318"
    depends_on:
      seq:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
    networks: [infra-net]

  seq:
    <<: *infra-service-defaults
    image: datalust/seq:2026.1.17004-x64@sha256:6f9a27389bc8deff86319c9591b21c1216ee24ceb71315127e33c68f14b38bc9
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH:?}
    ports:
      - "${INFRA_PRIVATE_IP:?}:5341:80"
    volumes:
      - seq-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 320M
    networks: [infra-net]

  prometheus:
    <<: *infra-service-defaults
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${INFRA_PRIVATE_IP:?}:9090:9090"
    extra_hosts:
      - "data-host:${DATA_PRIVATE_IP:?}"
    depends_on:
      otel-collector:
        condition: service_started
      postgres-exporter:
        condition: service_started
      billing-cost-exporter:
        condition: service_started
      livekit-cost-exporter:
        condition: service_started
      workspace-storage-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      metrics-exporter:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks: [infra-net]

  alertmanager:
    <<: *infra-service-defaults
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${ALERTMANAGER_CONFIG_PATH:?}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${INFRA_PRIVATE_IP:?}:9093:9093"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks: [infra-net]

  grafana:
    <<: *infra-service-defaults
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    ports:
      - "${INFRA_PRIVATE_IP:?}:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 192M
    networks: [infra-net]

  postgres-exporter:
    <<: *infra-service-defaults
    image: prometheuscommunity/postgres-exporter:v0.19.1@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
    environment:
      DATA_SOURCE_NAME: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD:?}@${DATA_PRIVATE_IP:?}:5432/postgres?sslmode=disable
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 80M
    networks: [infra-net]

  billing-cost-exporter:
    <<: *infra-service-defaults
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9188
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD:?}@${DATA_PRIVATE_IP:?}:5432/warptalk_billing?sslmode=disable
    volumes:
      - ../../observability/billing-cost-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 48M
    networks: [infra-net]

  livekit-cost-exporter:
    <<: *infra-service-defaults
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9189
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD:?}@${DATA_PRIVATE_IP:?}:5432/warptalk_translation_room?sslmode=disable
    volumes:
      - ../../observability/livekit-cost-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 48M
    networks: [infra-net]

  workspace-storage-exporter:
    <<: *infra-service-defaults
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9190
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD:?}@${DATA_PRIVATE_IP:?}:5432/warptalk_workspace?sslmode=disable
    volumes:
      - ../../observability/workspace-storage-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 48M
    networks: [infra-net]

  redis-exporter:
    <<: *infra-service-defaults
    image: oliver006/redis_exporter:v1.84.0@sha256:7ef8e9c26638158fa4e7ad60df8c7e53d1919986753d6c1d2d1876b6ec38d87b
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks: [infra-net]

  metrics-exporter:
    <<: *infra-service-defaults
    image: ${IMAGE_REGISTRY:?}/ai-metrics:${IMAGE_TAG:?}
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      METRICS_PORT: "9108"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:9108/health/ready", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
    networks: [infra-net]

volumes:
  redis-data:
  rabbitmq-data:
  seq-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  infra-net:
    driver: bridge
