name: warptalk-data

x-data-service-defaults: &data-service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 60s
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    <<: *data-service-defaults
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_compression=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
    ports:
      - "${DATA_PRIVATE_IP:?}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.50"
          memory: 4G
    networks: [data-net]

  pgbouncer:
    <<: *data-service-defaults
    image: edoburu/pgbouncer:v1.24.1-p1@sha256:3db3d7223e93af52b4116f642951a1a5fa44702a88c2a59cf7562cac19320c9e
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 15
      MIN_POOL_SIZE: 2
      RESERVE_POOL_SIZE: 5
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    volumes:
      - ../../pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "${DATA_PRIVATE_IP:?}:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks: [data-net]

  redis:
    <<: *data-service-defaults
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "${DATA_PRIVATE_IP:?}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1536M
    networks: [data-net]

  rabbitmq:
    <<: *data-service-defaults
    image: rabbitmq:4.1-management-alpine@sha256:be17ed4ea63adcbbd75e7fda9afe16860626bd7b5f6153acc262025b67cbe451
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${DATA_PRIVATE_IP:?}:5672:5672"
      - "${DATA_PRIVATE_IP:?}:15672:15672"
      - "${DATA_PRIVATE_IP:?}:15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
    networks: [data-net]

  minio:
    <<: *data-service-defaults
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Metrics stay private because port 9000 binds only to DATA_PRIVATE_IP.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${DATA_PRIVATE_IP:?}:9000:9000"
      - "${DATA_PRIVATE_IP:?}:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
    networks: [data-net]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_WORKSPACE_DOCUMENTS_BUCKET: ${MINIO_WORKSPACE_DOCUMENTS_BUCKET:?}
      MINIO_MEETING_CHAT_BUCKET: ${MINIO_MEETING_CHAT_BUCKET:?}
      MINIO_VOICE_SAMPLES_BUCKET: ${MINIO_VOICE_SAMPLES_BUCKET:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set data http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "data/$${MINIO_WORKSPACE_DOCUMENTS_BUCKET}" &&
        mc anonymous set none "data/$${MINIO_WORKSPACE_DOCUMENTS_BUCKET}" &&
        mc mb --ignore-existing "data/$${MINIO_MEETING_CHAT_BUCKET}" &&
        mc anonymous set none "data/$${MINIO_MEETING_CHAT_BUCKET}" &&
        mc mb --ignore-existing "data/$${MINIO_VOICE_SAMPLES_BUCKET}" &&
        mc anonymous set none "data/$${MINIO_VOICE_SAMPLES_BUCKET}"
    networks: [data-net]

  qdrant:
    <<: *data-service-defaults
    image: qdrant/qdrant:v1.15.3@sha256:31407c0e8e32eb771b71718f1a4772e2ad47a07557917b21ac96792f40eb8007
    ports:
      - "${DATA_PRIVATE_IP:?}:6333:6333"
      - "${DATA_PRIVATE_IP:?}:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 2G
    networks: [data-net]

  otel-collector:
    <<: *data-service-defaults
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ../../observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "${DATA_PRIVATE_IP:?}:4317:4317"
      - "${DATA_PRIVATE_IP:?}:4318:4318"
    depends_on:
      seq:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
    networks: [data-net]

  seq:
    <<: *data-service-defaults
    image: datalust/seq:2026.1.17004-x64@sha256:6f9a27389bc8deff86319c9591b21c1216ee24ceb71315127e33c68f14b38bc9
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH:?}
    ports:
      - "${DATA_PRIVATE_IP:?}:5341:80"
    volumes:
      - seq-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 512M
    networks: [data-net]

  prometheus:
    <<: *data-service-defaults
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${DATA_PRIVATE_IP:?}:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
      postgres-exporter:
        condition: service_started
      billing-cost-exporter:
        condition: service_started
      livekit-cost-exporter:
        condition: service_started
      workspace-storage-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      metrics-exporter:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 384M
    networks: [data-net]

  alertmanager:
    <<: *data-service-defaults
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${ALERTMANAGER_CONFIG_PATH:?}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${DATA_PRIVATE_IP:?}:9093:9093"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M
    networks: [data-net]

  grafana:
    <<: *data-service-defaults
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    ports:
      - "${DATA_PRIVATE_IP:?}:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
    networks: [data-net]

  postgres-exporter:
    <<: *data-service-defaults
    image: prometheuscommunity/postgres-exporter:v0.19.1@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
    environment:
      DATA_SOURCE_NAME: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M
    networks: [data-net]

  billing-cost-exporter:
    <<: *data-service-defaults
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9188
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD:?}@postgres:5432/warptalk_billing?sslmode=disable
    volumes:
      - ../../observability/billing-cost-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M
    networks: [data-net]

  livekit-cost-exporter:
    <<: *data-service-defaults
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9189
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD:?}@postgres:5432/warptalk_translation_room?sslmode=disable
    volumes:
      - ../../observability/livekit-cost-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M
    networks: [data-net]

  workspace-storage-exporter:
    <<: *data-service-defaults
    image: burningalchemist/sql_exporter:0.24.3@sha256:f2de0ba8061268bd980d206101846d461117439bb61a9b666a5ffc4f77ad1afa
    command:
      - -config.file=/etc/sql_exporter/sql_exporter.yml
      - -web.listen-address=:9190
    environment:
      SQLEXPORTER_TARGET_DSN: postgresql://warptalk_monitor:${MONITOR_DB_PASSWORD:?}@postgres:5432/warptalk_workspace?sslmode=disable
    volumes:
      - ../../observability/workspace-storage-queries.yml:/etc/sql_exporter/sql_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M
    networks: [data-net]

  redis-exporter:
    <<: *data-service-defaults
    image: oliver006/redis_exporter:v1.84.0@sha256:7ef8e9c26638158fa4e7ad60df8c7e53d1919986753d6c1d2d1876b6ec38d87b
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M
    networks: [data-net]

  metrics-exporter:
    <<: *data-service-defaults
    image: ${IMAGE_REGISTRY:?}/ai-metrics:${IMAGE_TAG:?}
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      METRICS_PORT: "9108"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:9108/health/ready", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
    networks: [data-net]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  qdrant-data:
  seq-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  data-net:
    driver: bridge
