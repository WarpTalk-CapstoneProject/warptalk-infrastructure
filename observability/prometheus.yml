# ====================================================================
# Prometheus Configuration for WarpTalk
# Scrapes OTLP-converted application metrics and core infrastructure exporters.
# ====================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'warptalk-applications'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'warptalk-redis-streams'
    static_configs:
      - targets: ['metrics-exporter:9108']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'billing-cost'
    static_configs:
      - targets: ['billing-cost-exporter:9188']

  - job_name: 'livekit-cost'
    static_configs:
      - targets: ['livekit-cost-exporter:9189']

  - job_name: 'workspace-storage'
    static_configs:
      - targets: ['workspace-storage-exporter:9190']

  - job_name: 'minio-buckets'
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'qdrant'
    metrics_path: /metrics
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
